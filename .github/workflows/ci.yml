name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一个 PR 的多次推送只保留最新一次，省点 CI 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验（配置 + 构建 + 冒烟）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexus-panel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus-panel/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 两套入口（无构建 / Vite+React）的配置分属多个文件，
      # 手改一处忘一处是老毛病，这一步挡住漂移
      - name: 配置漂移检查
        run: npm run config:check

      # Rust 命令（定义/注册）与前端调用（api.ts / types.ts）是四处分散的契约，
      # 漏改任何一处都要到运行时才暴露，且报错方向往往误导
      - name: 跨端契约一致性检查
        run: npm run crossend:check -- --strict

      - name: Vite 构建（验证多页入口与外壳重命名）
        run: npm run build

      - name: 冒烟 · 无构建外壳
        run: npm run test

      - name: 冒烟 · React 外壳
        run: npm run test:react

      - name: 桥接 · 隔离态能力
        run: npm run test:bridge
