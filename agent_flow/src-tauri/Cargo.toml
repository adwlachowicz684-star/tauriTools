[package]
name = "agent-flow"
version = "0.1.0"
description = "可视化编排 TraeCode / WorkBuddy CLI 任务流"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
