<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP 由 config/nexus.config.mjs 生成，改策略请改那里再跑 npm run config:sync -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: http://asset.localhost blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost http://localhost:1420 ws://localhost:1420 http://127.0.0.1:1420 ws://127.0.0.1:1420; media-src 'self' asset: http://asset.localhost blob:; frame-src 'self'" />
  <title>Nexus Panel</title>
  <script>
    /* 首屏防闪：主题系统就绪前先把底色铺上，避免白闪。
       颜色由 theme-manager 每次应用主题时写入 localStorage，
       所以新增主题不必回来改这里 —— 只改 js/themes.js 即可。

       与 index.html（无构建模式）里的同名脚本保持一致。

       注意：这里用注入 <style> 而不是内联 style.background ——
       内联样式优先级最高，主题初始化后不会被覆盖，
       首屏是深色、切到浅色后底色会卡在深色那一版。 */
    (function () {
      try {
        var bg = localStorage.getItem('nexus:preload-bg');
        var fg = localStorage.getItem('nexus:preload-fg');
        if (!bg) return;
        var st = document.createElement('style');
        st.id = 'nexus-preload-bg';
        st.textContent =
          'html,body{background:' + bg + ';' +
          (fg ? 'color:' + fg + ';' : '') + '}';
        document.head.appendChild(st);
      } catch (e) { /* 存储不可用时忽略 */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
