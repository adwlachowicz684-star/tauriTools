<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>取色服务</title>
  <style>
    /* 服务插件在隐藏容器里运行，但被调用时会临时显示（见宿主 showServiceUi），
       所以这里要写完整的取色面板样式。 */
    html, body { margin: 0; height: 100%; font: 12px/1.6 system-ui, sans-serif; }
    body { padding: 10px; box-sizing: border-box; color: var(--text, #ddd); }
    .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 6px 0; }
    .sw { aspect-ratio: 1; border: none; border-radius: 3px; cursor: pointer; padding: 0; }
    .sw.sel { outline: 2px solid var(--accent, #3E63DD); outline-offset: 1px; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    input { background: var(--surface-sunk, #222); color: var(--text, #ddd);
            border: 1px solid var(--edge, #444); border-radius: 3px; height: 26px;
            padding: 0 6px; font-size: 12px; }
    button { background: var(--surface, #333); color: var(--text, #ddd);
             border: 1px solid var(--edge, #444); border-radius: 3px;
             height: 26px; padding: 0 10px; cursor: pointer; font-size: 12px; }
    button.primary { background: var(--accent, #3E63DD); color: #fff; border-color: transparent; }
    .sl { width: 100%; }
    .preview { width: 40px; height: 26px; border-radius: 3px; border: 1px solid var(--edge, #444); }
    /* HSV：SV 平面 + 色相条。
       面板底色由 JS 按当前色相写入（纯色），两层 CSS 渐变叠出白→彩→黑。 */
    .svwrap { margin: 6px 0; }
    .sv { position: relative; width: 100%; height: 160px; border-radius: 4px;
          border: 1px solid var(--edge, #444); cursor: crosshair; touch-action: none; }
    .sv-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%;
              border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6);
              transform: translate(-50%, -50%); pointer-events: none; }
    .hue { position: relative; width: 100%; height: 12px; border-radius: 6px;
           cursor: pointer; touch-action: none; margin-bottom: 8px;
           background: linear-gradient(to right,
             #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
    .hue-dot { position: absolute; top: 50%; width: 10px; height: 16px;
               border-radius: 3px; background: #fff;
               box-shadow: 0 0 0 1px rgba(0,0,0,.6);
               transform: translate(-50%, -50%); pointer-events: none; }
    .hint { opacity: .65; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="ui"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
