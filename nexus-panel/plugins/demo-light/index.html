<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>示例·订单面板</title>
<style>
  /* 配色一律走外壳推过来的主题变量，不写死任何颜色。
     插件自己写死颜色是它自己的选择 —— 外壳不做反转、不做覆盖，
     变量给到哪就渲染到哪。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    font-size: 14px;
    padding: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .lead { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--r-sm, 4px);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; cursor: pointer;
    padding: 8px 16px;
    border: 0; border-radius: var(--r-sm, 3px);
    background: var(--accent);
    /* 叠在强调色上的前景色按强调色明暗派生（黑或白），
       写死白字在亮黄强调色上对比度只有 1.09，等于看不见。 */
    color: var(--badge-fg, #fff);
  }
  button.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--divider); }
  input {
    font: inherit; padding: 8px 12px;
    border: 1px solid var(--divider); border-radius: var(--r-sm, 3px);
    background: var(--surface); color: var(--text);
    width: 220px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--hairline); }
  th { color: var(--text-dim); font-weight: 500; background: var(--surface-sunk); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 2px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent); font-size: 12px;
  }
  .tag.green { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .tag.red   { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .stats { display: flex; gap: 14px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--r-sm, 4px); padding: 14px; }
  .stat .k { font-size: 12px; color: var(--text-dim); }
  .stat .v { font-size: 24px; font-weight: 600; color: var(--accent); margin-top: 4px; }
  .bar { height: 8px; background: var(--surface-sunk); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 68%; }
  .thumb { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; margin-top: 10px; }
  #plugin-mount { min-height: 100%; }
</style>
</head>
<body>
<div id="plugin-mount">
  <h1>Order Dashboard</h1>
  <div class="lead">第三方面板风格的数据页；配色全部走外壳推来的主题变量，切主题时跟着变。</div>

  <div class="stats">
    <div class="stat"><div class="k">今日订单</div><div class="v">1,284</div><div class="bar"><i style="width:68%"></i></div></div>
    <div class="stat"><div class="k">成交额</div><div class="v">¥86K</div><div class="bar"><i style="width:42%"></i></div></div>
    <div class="stat"><div class="k">退款率</div><div class="v">1.2%</div><div class="bar"><i style="width:12%"></i></div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>筛选</h2>
    <div class="row">
      <input id="kw" placeholder="搜索订单号…" />
      <button id="go">查询</button>
      <button class="ghost" id="reset">重置</button>
      <span class="tag">示例</span>
      <span class="tag green">运行中</span>
      <span class="tag red">2 异常</span>
    </div>
  </div>

  <div class="card">
    <h2>最近订单</h2>
    <table>
      <thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td>#10231</td><td>张三</td><td>¥1,280</td><td><span class="tag green">已完成</span></td></tr>
        <tr><td>#10232</td><td>李四</td><td>¥320</td><td><span class="tag">处理中</span></td></tr>
        <tr><td>#10233</td><td>王五</td><td>¥2,450</td><td><span class="tag red">已退款</span></td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>图示配色</h2>
    <!-- 内联 SVG：状态色走主题变量，切主题时跟着变 -->
    <svg class="thumb" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="90" fill="var(--surface-sunk)"/>
      <circle cx="60" cy="45" r="24" fill="var(--danger)"/>
      <rect x="120" y="30" width="120" height="30" rx="4" fill="var(--ok)"/>
      <polygon points="290,20 330,70 250,70" fill="var(--accent)"/>
      <text x="16" y="82" font-size="12" fill="var(--text-dim)">状态色跟随主题</text>
    </svg>
    <div id="out" style="margin-top:10px;color:var(--text-dim);font-size:12px"></div>
  </div>
</div>

<script type="module">
  import { bootIframePlugin } from '../../js/plugin-sdk.js';

  // 即便在沙箱里，也能拿到和同页插件完全一致的 ctx
  bootIframePlugin(async (ctx) => {
    document.getElementById('go').onclick = () => {
      const kw = document.getElementById('kw').value || '(空)';
      document.getElementById('out').textContent = `查询：${kw} · mode=${ctx.mode}`;
      ctx.toast('已查询：' + kw);
    };
    document.getElementById('reset').onclick = () => {
      document.getElementById('kw').value = '';
      document.getElementById('out').textContent = '';
    };
    ctx.setBadge(2);
  });
</script>
</body>
</html>
