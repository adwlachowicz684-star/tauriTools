<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>浅色第三方插件（演示适配）</title>
<style>
  /* 故意写成典型"浅色扁平"风格：纯白底、深灰字、无阴影、直角
     这是第三方插件最常见的样子，与深色新拟态面板天然冲突 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ffffff; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #333333;
    font-size: 14px;
    padding: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; color: #111111; margin-bottom: 6px; }
  .lead { color: #888888; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #f5f6f8;
    border: 1px solid #e3e5e8;
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #222222; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; cursor: pointer;
    padding: 8px 16px;
    border: 0; border-radius: 3px;
    background: #2f6fed; color: #ffffff;
  }
  button.ghost { background: #ffffff; color: #333333; border: 1px solid #d0d3d8; }
  input {
    font: inherit; padding: 8px 12px;
    border: 1px solid #d0d3d8; border-radius: 3px;
    background: #ffffff; color: #333333;
    width: 220px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e8eaed; }
  th { color: #888888; font-weight: 500; background: #fafbfc; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 2px;
    background: #e8f0fe; color: #2f6fed; font-size: 12px;
  }
  .tag.green { background: #e6f7ee; color: #17a673; }
  .tag.red   { background: #fdecec; color: #e5484d; }
  .stats { display: flex; gap: 14px; }
  .stat { flex: 1; background: #ffffff; border: 1px solid #e3e5e8; border-radius: 4px; padding: 14px; }
  .stat .k { font-size: 12px; color: #888888; }
  .stat .v { font-size: 24px; font-weight: 600; color: #2f6fed; margin-top: 4px; }
  .bar { height: 8px; background: #eceff3; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: #2f6fed; width: 68%; }
  /* 图片：用来验证"二次反转还原"是否生效 */
  .thumb { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; margin-top: 10px; }
  #plugin-mount { min-height: 100%; }
</style>
</head>
<body>
<div id="plugin-mount">
  <h1>Order Dashboard</h1>
  <div class="lead">这是一个典型的第三方浅色扁平插件 —— 用来演示外壳的自动深色适配。</div>

  <div class="stats">
    <div class="stat"><div class="k">今日订单</div><div class="v">1,284</div><div class="bar"><i style="width:68%"></i></div></div>
    <div class="stat"><div class="k">成交额</div><div class="v">¥86K</div><div class="bar"><i style="width:42%"></i></div></div>
    <div class="stat"><div class="k">退款率</div><div class="v">1.2%</div><div class="bar"><i style="width:12%"></i></div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>筛选</h2>
    <div class="row">
      <input id="kw" placeholder="搜索订单号…" />
      <button id="go">查询</button>
      <button class="ghost" id="reset">重置</button>
      <span class="tag">已适配</span>
      <span class="tag green">运行中</span>
      <span class="tag red">2 异常</span>
    </div>
  </div>

  <div class="card">
    <h2>最近订单</h2>
    <table>
      <thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td>#10231</td><td>张三</td><td>¥1,280</td><td><span class="tag green">已完成</span></td></tr>
        <tr><td>#10232</td><td>李四</td><td>¥320</td><td><span class="tag">处理中</span></td></tr>
        <tr><td>#10233</td><td>王五</td><td>¥2,450</td><td><span class="tag red">已退款</span></td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>图片（验证反色还原）</h2>
    <!-- 内联 SVG 数据图：若适配正确，颜色应原样保留、不被反色 -->
    <svg class="thumb" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="90" fill="#dfe7f5"/>
      <circle cx="60" cy="45" r="24" fill="#e5484d"/>
      <rect x="120" y="30" width="120" height="30" rx="4" fill="#17a673"/>
      <polygon points="290,20 330,70 250,70" fill="#2f6fed"/>
      <text x="16" y="82" font-size="12" fill="#333">颜色应保持原样</text>
    </svg>
    <div id="out" style="margin-top:10px;color:#888;font-size:12px"></div>
  </div>
</div>

<script type="module">
  import { bootIframePlugin } from '../../js/plugin-sdk.js';

  // 即便在沙箱里，也能拿到和同页插件完全一致的 ctx
  bootIframePlugin(async (ctx) => {
    document.getElementById('go').onclick = () => {
      const kw = document.getElementById('kw').value || '(空)';
      document.getElementById('out').textContent = `查询：${kw} · mode=${ctx.mode}`;
      ctx.toast('已查询：' + kw);
    };
    document.getElementById('reset').onclick = () => {
      document.getElementById('kw').value = '';
      document.getElementById('out').textContent = '';
    };
    ctx.setBadge(2);
  });
</script>
</body>
</html>
