<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>KityMinder</title>
    <link rel="stylesheet" href="kityminder.core.css">
    <style>
        /* WebView2 是独立 HWND，WPF 的 CornerRadius/ClipToBounds 裁剪不了它，圆角只能由网页自身绘制。
           要点一：html/body 必须均透明——若根元素透明，body 的背景会触发「背景传播」上提到画布整块铺底，
           border-radius 随之失效 = 之前始终方角的根因。
           要点二：圆角+不透明底+overflow 放到真实盒子 #minder-container 上才有可裁剪的盒子；
           角部缺口露出 WebView2 DefaultBackgroundColor(#1B1B1F，=宿主边框底色)，与卡片形成弧线对比。 */
        html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
        /* ==== 画布配色变量（Nexus Panel 移植新增）====
           原版全部硬编码深色以贴合 WPF 外壳；插件版要跟随 nexus 外壳的亮/暗主题，
           故抽成变量，由插件层通过门面 setCanvasTheme() 注入。默认值即原版深色，
           WPF 宿主不调用该门面时行为与原来完全一致。 */
        :root {
            --km-canvas-bg: #1E1E1E;        /* 画布底色 */
            --km-canvas-border: #3D4250;    /* 圆角内描边 */
            --km-panel-bg: #222225;         /* 搜索面板底 */
            --km-panel-head-bg: #26262B;    /* 搜索面板头部 */
            --km-panel-text: #CFCFCF;       /* 面板正文 */
            --km-panel-dim: #9A9AA0;        /* 面板次要文字 */
            --km-panel-hover: #2C2C33;      /* 面板条目悬停 */
            --km-panel-close-hover: #3A3A40;/* 关闭按钮悬停 */
            --km-loading-bg: rgba(27,27,31,.9);
            --km-loading-text: #AFAFAF;
        }
        #minder-container {
            position: absolute; inset: 0;
            border-radius: 8px;                 /* 与 WPF DarkFrame/KityMinderHost(8) 对齐 */
            background: var(--km-canvas-bg);
            overflow: hidden;                   /* 把画布内容裁剪进圆角内 */
            box-sizing: border-box;
            box-shadow: inset 0 0 0 1px var(--km-canvas-border);/* 1px 内描边，勾勒圆弧边界 */
        }
        /* 页面内加载遮罩（WebView2 内自绘，WPF 层遮罩会被 HWND 盖住四角变方角） */
        #km-loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--km-loading-bg);
            border-radius: 8px;
            overflow: hidden;
            color: var(--km-loading-text); font-size: 14px;
            z-index: 9999;
            pointer-events: none;
        }
        /* 隐藏鼠标按下时的蓝色选中框，桌面应用里很碍眼 */
        #minder-container * { user-select: none; }
        /* ---- 搜索结果面板：画布左侧浮层，匹配数 >3 时由 JS 显示；条目可点击聚焦 ---- */
        #search-panel {
            position: absolute; left: 10px; top: 10px;
            width: 232px; max-height: calc(100% - 20px);
            display: none; flex-direction: column;
            background: var(--km-panel-bg);
            border: 1px solid var(--km-canvas-border); border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.45);
            overflow: hidden;
            font: 12px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;
            user-select: none; z-index: 500;   /* 画布之上、加载遮罩(9999)之下 */
        }
        #search-panel.sp-visible { display: flex; }
        #search-panel .sp-head {
            flex: none; display: flex; align-items: center;
            padding: 5px 8px 5px 10px;
            color: var(--km-panel-text); background: var(--km-panel-head-bg);
            border-bottom: 1px solid var(--km-canvas-border);
        }
        #search-panel .sp-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #search-panel .sp-close {
            flex: none; cursor: pointer; color: var(--km-panel-dim);
            width: 18px; height: 18px; line-height: 16px; text-align: center; border-radius: 4px;
        }
        #search-panel .sp-close:hover { background: var(--km-panel-close-hover); color: var(--km-panel-text); }
        #search-panel .sp-list { flex: 1; overflow-y: auto; padding: 4px 0; }
        #search-panel .sp-item {
            padding: 3px 10px; color: var(--km-panel-text); cursor: pointer;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #search-panel .sp-item:hover { background: var(--km-panel-hover); }
        #search-panel .sp-item.sp-active { background: #0A84FF; color: #FFFFFF; }
        #search-panel .sp-item mark { background: transparent; color: #FFD60A; font-weight: 600; }
    </style>
</head>
<body>
    <div id="minder-container"></div>

    <!-- 加载遮罩放进 WebView2 页面内：WPF 层遮罩会被 WebView2 独立 HWND 盖住四角产生方角，页面内自绘圆角+裁剪才可靠；每次导航/重载自动重现 -->
    <div id="km-loading">思维导图加载中…</div>

    <script defer src="kity.min.js"></script>
    <script defer src="kityminder.core.min.js"></script>
    <script>
    // ==== 宿主通信门面（必须最先执行：页面内所有通知都经由它发出）====
    // 原版只走 WebView2 的 window.chrome.webview；本页被嵌套进 Nexus Panel 插件层 iframe 后没有该对象，
    // 需回退到 postMessage 发给父窗口。此处收口，WPF 宿主（junction_link）行为完全不变。
    var KM_HOST_CHANNEL = 'kityminder-host-v1';
    function hostPost(msg) {
        var wv = (window.chrome && window.chrome.webview) || null;
        if (wv && typeof wv.postMessage === 'function') {
            try { wv.postMessage(msg); return; } catch (e) {}
        }
        try {
            if (window.parent && window.parent !== window) {
                var out = { channel: KM_HOST_CHANNEL };
                for (var k in msg) if (Object.prototype.hasOwnProperty.call(msg, k)) out[k] = msg[k];
                window.parent.postMessage(out, '*');
            }
        } catch (e) {}
    }
    // 嵌套 iframe 模式下由父窗口回执，配合 window.__resolveHost 完成 request/response 配对
    window.addEventListener('message', function (e) {
        var d = e && e.data;
        if (!d || d.channel !== KM_HOST_CHANNEL) return;
        if (d.type === 'response') {
            if (typeof window.__resolveHost === 'function') window.__resolveHost(d.id, d.result);
            return;
        }
        // 父窗口下发画布配色（插件层跟随外壳亮/暗主题）。
        // 本监听器早于 km 初始化注册，故先存起来：门面就绪后由 __applyPendingCanvasTheme 补套。
        if (d.type === 'theme') {
            window.__kmCanvasVars = d.vars || null;
            try {
                if (window.__minder && window.__minder.setCanvasTheme) {
                    window.__minder.setCanvasTheme(window.__kmCanvasVars);
                }
            } catch (e2) { /* 未就绪则等门面建好后再套 */ }
        }
    });

    // 首帧即圆角：两个库脚本 defer（后台加载、不阻塞首次绘制），初始化推迟到 DOMContentLoaded（此刻库已就绪）。
    // 前提：kity.min.js / kityminder.core.min.js 必须与 index.html 同目录存在，否则 defer 加载 404 → kityminder 未定义。
    document.addEventListener('DOMContentLoaded', function () {
    (function () {
        var km = window.__km = new kityminder.Minder({ renderTo: '#minder-container' });
        km.enable();                       // 进编辑态；只读场景换成 km.disable()
        // 布局过渡动画开关由设置面板控制（WPF 侧导航前注入 window.__kmAnimateLayout）：
        // 关闭（默认）时打开画布/展开收起不播节点扩散动画，直接显示最终布局；开启则保留 300ms 过渡。
        if (!window.__kmAnimateLayout) km.setOption('layoutAnimationDuration', 0);
        km.setTheme('fresh-blue');

        // ---- 文件附件支持（自注册 file 命令 + 节点右侧文件图标渲染器；点击图标经 WPF 打开文件）----
        // 必须在首次渲染（importJson）前把渲染器类挂进 _rendererClasses，节点渲染时才带出文件图标。
        (function () {
            var FileCommand = kity.createClass('fileCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value) n.setData('file', value);
                        else n.setData('file');
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('file')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('file') || '') : '';
                }
            });
            try { km._commands['file'] = new FileCommand(); } catch (e) {}

            // 视频附件（独立 data.video 字段）：与 file 区分，节点可同时挂文件与视频；路径进 xmind 时映射为 href
            var VideoCommand = kity.createClass('videoCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value) n.setData('video', value);
                        else n.setData('video');
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('video')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('video') || '') : '';
                }
            });
            try { km._commands['video'] = new VideoCommand(); } catch (e) {}

            /**
             * 附件图标的取色。
             * ============================================================
             * node.getStyle('color') 在不少主题下返回 **null** —— core 的
             * getStyle 只在主题项里查得到才返回值，查不到就是 null。
             *
             * 而 kity 的 fill() 是：
             *     fill: function (a) {
             *         a && node.setAttribute('fill', a.toString());
             *         null === a && node.removeAttribute('fill');   // ← 关键
             *     }
             * 传 null 等于**删掉** fill 属性。SVG 缺 fill 时**默认黑色**，
             * 于是图标在深色画布上变成一块纯黑矩形 —— 既看不见形状也认不出
             * 是文件还是视频，正是「附加文件后是个黑框」的原因。
             *
             * 所以取不到主题色时必须回落到明确颜色，绝不能把 null 传进去。
             */
            function iconColor(node) {
                var c = null;
                try { c = node.getStyle('color'); } catch (e) { c = null; }
                return c || '#AEB6C4';
            }

            /** 附件名：节点里存的是 encodeRef 序列化后的 JSON 字符串 */
            function refName(raw) {
                if (!raw) return '';
                try {
                    var o = typeof raw === 'string' ? JSON.parse(raw) : raw;
                    return o && o.n ? String(o.n) : '';
                } catch (e) { return ''; }
            }

            var FileIcon = kity.createClass('FileIcon', {
                base: kity.Group,
                constructor: function () {
                    this.callBase();
                    this.width = 16;
                    this.height = 20;
                    this.rect = new kity.Rect(16, 20, 0, -10, 3).fill('transparent');
                    // fill 保持 none：实心的话会盖住折角那条线，看不出是「文件」
                    this.path = (new kity.Path).setPathData('M-8,-10 L-1,-10 L3,-6 L3,10 L-8,10 Z M-1,-10 L-1,-6 L3,-6')
                        .fill('none');
                    this.addShapes([this.rect, this.path]);
                    this.on('mouseover', function () { this.rect.fill('rgba(90, 141, 214, 0.25)'); })
                        .on('mouseout', function () { this.rect.fill('transparent'); });
                    this.setStyle('cursor', 'pointer');
                },
                /** 描边色 = 节点文字色（取不到则由 iconColor 回落） */
                paint: function (color) {
                    try { this.path.stroke(color, 1.3); } catch (e) {}
                    return this;
                }
            });

            var VideoIcon = kity.createClass('VideoIcon', {
                base: kity.Group,
                constructor: function () {
                    this.callBase();
                    this.width = 20;
                    this.height = 16;
                    this.frame = new kity.Rect(20, 16, 0, -8, 3).fill('transparent');
                    // 三角同样是实心填充，不显式上色就是黑的
                    this.path = (new kity.Path).setPathData('M-6,-6 L6,0 L-6,6 Z');
                    this.addShapes([this.frame, this.path]);
                    this.on('mouseover', function () { this.frame.fill('rgba(90, 141, 214, 0.25)'); })
                        .on('mouseout', function () { this.frame.fill('transparent'); });
                    this.setStyle('cursor', 'pointer');
                },
                paint: function (color) {
                    try {
                        this.frame.stroke(color, 1.2);
                        this.path.fill(color).stroke(color, 1);
                    } catch (e) {}
                    return this;
                }
            });
            // 不能把 FileRenderer 挂进 _rendererClasses['right']：core 的 renderNodeBatch 按 b[0] 节点
            // 的渲染器数整体迭代，根节点无 right 渲染器、子节点多一个时，g._renderers[c] 会取到 undefined，
            // 在 "e.contentBox=..." 处抛 "Cannot set properties of undefined (setting 'contentBox')"，
            // 使子节点无法布局、全部堆在画布中心。改为 noderender 事件把文件图标作为独立形状绘制到节点渲染层，
            // 与下方分组边界/组标签钩子同构，既保留文件图标又不扰动渲染器数组。
            try {
                // 文件/视频图标各自独立绘制（noderender 内一起清理重建），节点可同时挂两者：
                // 文件在 baseX，存在文件时视频右移 20 与文件并排，互不覆盖。
                km.on('noderender', function (e) {
                    var node = e && e.node;
                    if (!node) return;
                    try {
                        var old = node._kmFileIcon, oldv = node._kmVideoIcon;
                        if (old) { if (old.remove) old.remove(); node._kmFileIcon = null; }
                        if (oldv) { if (oldv.remove) oldv.remove(); node._kmVideoIcon = null; }
                        var box = node.getContentBox();
                        if (!box) return;
                        var baseX = box.right + node.getStyle('space-left');
                        var y = box.cy;
                        var rc = node.getRenderContainer();
                        if (!rc || !rc.appendShape) return;
                        var color = iconColor(node);
                        function attach(icon, path, cursorX, tip) {
                            icon.paint(color);
                            // 悬停提示：光看图标认不出挂的是哪个文件
                            if (tip && icon.node) {
                                try {
                                    var t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                                    t.textContent = tip;
                                    icon.node.appendChild(t);
                                } catch (e2) {}
                            }
                            icon.setTranslate(cursorX, y);
                            icon.on('mousedown', function (ev) {
                                ev.preventDefault();
                                if (path) { try { hostPost({ type: 'openfile', path: path }); } catch (e2) {} }
                            });
                            rc.appendShape(icon);
                        }
                        if (node.getData('file')) {
                            var fc = new FileIcon();
                            attach(fc, node.getData('file'), baseX, refName(node.getData('file')) || '文件附件');
                            node._kmFileIcon = fc;
                            baseX += 20;
                        }
                        if (node.getData('video')) {
                            var vc = new VideoIcon();
                            attach(vc, node.getData('video'), baseX, refName(node.getData('video')) || '视频附件');
                            node._kmVideoIcon = vc;
                        }
                    } catch (e2) {}
                });
            } catch (e) {}
        })();

        // ---- 选中框视觉同步：强制重渲「从选中变为未选中」的节点，清掉点空白处后可能残留的高亮矩形 ----
        // 内核取消选中时理论上会对被移除节点重渲；偶发漏渲会让高亮残留（纯显示问题，功能已失效）。
        // 这里在任何选中变更后，把上一步选中、现在未选中的节点再 render() 一次，保证显示与选中态一致。
        (function () {
            var last = [];
            function curSel() { try { return km.getSelectedNodes().slice(); } catch (e) { return []; } }
            function sync() {
                var now = curSel();
                var removed = [];
                last.forEach(function (n) {
                    if (n && n.render && now.indexOf(n) === -1) removed.push(n);
                });
                last = now;
                removed.forEach(function (n) { try { n.render(); } catch (e) {} });
            }
            try { km.on('selectionchange', sync); } catch (e) {}
            try { km.on('selectionclear', sync); } catch (e) {}
        })();
        // 启动时给一个默认根节点，避免画布空白
        km.importJson({ root: { data: { text: '中心主题' } } });

        // ---- 容器尺寸变化后重排：WebView2 在 Popup 弹出过程中首帧容器尺寸可能偏小，
        // kityminder core 不监听 resize，节点就困在首帧小范围里（视觉：节点挤在画布中间、四周留白）。
        // 尺寸显著变化（或首次拿到足够尺寸）时用当前容器重排一次，让布局占满画布。
        (function () {
            var lastW = 0, lastH = 0, done = false;
            function ensureRelayout() {
                var c = document.getElementById('minder-container');
                if (!c) return;
                var w = c.clientWidth, h = c.clientHeight;
                if (w <= 0 || h <= 0) return;
                var changed = (lastW > 0 && lastH > 0) && (w !== lastW || h !== lastH);
                lastW = w; lastH = h;
                if ((changed || !done) && (w > 300 && h > 200)) {
                    done = true;
                    try { km.refresh(); } catch (e) {}
                }
            }
            window.addEventListener('resize', ensureRelayout);
            setInterval(ensureRelayout, 400);
        })();

        // ---- 删除线支持（core 无内置命令：自注册 strikethrough 命令 + 文本样式 hook）----
        (function () {
            var StrikethroughCommand = kity.createClass('strikethroughCommand', {
                base: kityminder.Command,
                execute: function (m) {
                    var nodes = m.getSelectedNodes();
                    var on = this.queryState() != 1;
                    nodes.forEach(function (n) {
                        if (on) n.setData('font-strikethrough', true);
                        else n.setData('font-strikethrough');
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('font-strikethrough')) { result = 1; return false; }
                    });
                    return result;
                }
            });
            try { km._commands['strikethrough'] = new StrikethroughCommand(); } catch (e) {}
            var strikeHookDone = false;
            function tryRegisterStrikeHook() {
                if (strikeHookDone) return;
                try {
                    var root = km.getRoot && km.getRoot();
                    var tr = root && root.getRenderer && root.getRenderer('TextRenderer');
                    var TR = tr && tr.constructor;
                    if (!TR || !TR.registerStyleHook) return;
                    TR.registerStyleHook(function (node, textGroup) {
                        var strike = node.getData && node.getData('font-strikethrough');
                        textGroup.eachItem(function (i, t) {
                            if (t && t.setAttr) t.setAttr('text-decoration', strike ? 'line-through' : 'none');
                        });
                    });
                    strikeHookDone = true;
                } catch (e) {}
            }
            try { km.on('noderender', tryRegisterStrikeHook); } catch (e) {}
            tryRegisterStrikeHook();
        })();

        // ---- 文字对齐支持（core 无内置命令：自注册 textalign 命令 + 文本样式 hook）----
        (function () {
            var TextAlignCommand = kity.createClass('textalignCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value === 'left') n.setData('text-align');
                        else n.setData('text-align', value);
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes();
                    if (nodes.length === 0) return -1;
                    var result = 0;
                    nodes.forEach(function (n) {
                        if (n && n.getData('text-align')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('text-align') || 'left') : 'left';
                }
            });
            try { km._commands['textalign'] = new TextAlignCommand(); } catch (e) {}
            var alignHookDone = false;
            function tryRegisterAlignHook() {
                if (alignHookDone) return;
                try {
                    var root = km.getRoot && km.getRoot();
                    var tr = root && root.getRenderer && root.getRenderer('TextRenderer');
                    var TR = tr && tr.constructor;
                    if (!TR || !TR.registerStyleHook) return;
                    TR.registerStyleHook(function (node, textGroup) {
                        var align = node.getData && node.getData('text-align');
                        if (!align || align === 'left') {
                            textGroup.eachItem(function (i, t) {
                                if (t && t.setX) t.setX(0);
                            });
                            return;
                        }
                        var widths = [];
                        textGroup.eachItem(function (i, t) {
                            var w = 0;
                            try { w = t.getBoundaryBox ? t.getBoundaryBox().width : 0; } catch (e) {}
                            widths.push(w);
                        });
                        var maxW = 0;
                        for (var i = 0; i < widths.length; i++) if (widths[i] > maxW) maxW = widths[i];
                        textGroup.eachItem(function (i, t) {
                            var w = widths[i] || 0, x = 0;
                            if (align === 'center') x = (maxW - w) / 2;
                            else if (align === 'right') x = maxW - w;

            // 万一重入到这里，editLayer 已空则直接返回，不会二次提交。

             * ------------------------------------------------------------

             * 不改 font-size）。两者量纲不同，直接混用就会在 zoom≠100% 时错位：

            var el = document.createElement('div');

            el.style.cssText = 'position:absolute;z-index:110;outline:none;background:transparent;border:none;box-shadow:none;' +
                'margin:0;padding:0;cursor:text;white-space:pre;word-break:break-word;' +
                // 不设 overflow:hidden —— 输入超长时会被截断看不见，
                // 而节点文字本身是自适应的，编辑时也该跟着长。
                'user-select:text;-webkit-user-select:text;' +
                'color:' + (ws ? ws.color : '#e6e6e6') + ';' +
                'font-family:' + (ws ? ws.fontFamily : '"Segoe UI","Microsoft YaHei",sans-serif') + ';' +
                'font-size:' + scaledFs + 'px;' +
                'font-weight:' + (ws ? ws.fontWeight : 'normal') + ';' +
                'font-style:' + (ws ? ws.fontStyle : 'normal') + ';' +

        // （alt+up/down 上移下移、shift+tab 插入上级、ctrl+shift+l 整理布局、ctrl+=- 缩放、ctrl+c/x/v）。

            kmShortcut('Backspace', removeSelectedNode);

            //

            // 早先版本用「两级语义」（← 先折叠再上移、→ 先展开再进入），

                        return;

                    if (dir === 'left') {
                        if (!p) return;                       // 根节点没有父节点
                        km.select(p, true);                   // 纯上移，不折叠
                        return;

                    // right：进入第一个子节点。若当前折叠着则先展开再选中 ——
                    // 否则会选中一个被折叠隐藏、画面上看不见的节点。
                    if (!kids || !kids.length) return;

                    km.select(kids[0], true);

            }

            /**
             * 折叠 / 展开单个节点（不递归、不改变选中）。
             * renderTree 让子节点可见性随父节点联动，fire contentchange 让自动保存接住。
             */
            function setFold(n, wantExpand) {
                if (!n) return false;
                try {
                    if (n.isLeaf && n.isLeaf()) return false;   // 叶子无事可做
                    if (wantExpand) n.expand(); else n.collapse();
                    n.renderTree(); km.layout(100); km.fire('contentchange');

                } catch (e) { return false; }

            kmShortcut('up', function () { navNode('up'); });
            kmShortcut('down', function () { navNode('down'); });
            kmShortcut('left', function () { navNode('left'); });
            kmShortcut('right', function () { navNode('right'); });

            // ---- Ctrl+← 折叠 / Ctrl+→ 展开（对齐 XMind）----
            // 注：内核键码解析里 ctrl 与 cmd 等价（case "ctrl": case "cmd":，
            // 且事件侧判定为 a.ctrlKey || a.metaKey），所以 macOS 上按 Cmd+←/→ 同样生效 ——
            // 这点正好避开 macOS 把 Ctrl+←/→ 占用为「切换桌面」的系统快捷键。
            kmShortcut('ctrl+left', function () { setFold(km.getSelectedNode(), false); });

            kmShortcut('/', function () {

                } catch (e) {}
            });

            // ---- Alt+1~5：从选中节点展开到第 N 级 ----
            // 走页面自己的门面 expandSelectedToLevel（更深层一律收起），
            // 它不是内核命令，不能用 execCommand 调。
            for (var _lv = 1; _lv <= 5; _lv++) {
                (function (lv) {
                    kmShortcut('alt+' + lv, function () {
                        try {
                            if (window.__minder && window.__minder.expandSelectedToLevel) {
                                window.__minder.expandSelectedToLevel(lv);
                            }
                        } catch (e) {}

            }
        })();

        hostPost({ type: 'request', id: 0, action: 'log', payload: 'kityminder 就绪' });
    })();
    }, false);

    <script>
        // 加载遮罩自隐：km 初始化完成后（DOMContentLoaded）隐藏；WebView2 每次导航/重载会自动重现本遮罩
        (function () {
            var el = document.getElementById('km-loading');

            function hide() { el.style.display = 'none'; }

            else hide();
            window.addEventListener('load', hide);
            setTimeout(hide, 3000);   // 兜底：即使 DOMContentLoaded 未触发，也避免遮罩残留
        })();
    </script>
</body>
</html>
