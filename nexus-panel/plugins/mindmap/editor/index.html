<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>KityMinder</title>
    <link rel="stylesheet" href="kityminder.core.css">
    <style>
        /* WebView2 是独立 HWND，WPF 的 CornerRadius/ClipToBounds 裁剪不了它，圆角只能由网页自身绘制。
           要点一：html/body 必须均透明——若根元素透明，body 的背景会触发「背景传播」上提到画布整块铺底，
           border-radius 随之失效 = 之前始终方角的根因。
           要点二：圆角+不透明底+overflow 放到真实盒子 #minder-container 上才有可裁剪的盒子；
           角部缺口露出 WebView2 DefaultBackgroundColor(#1B1B1F，=宿主边框底色)，与卡片形成弧线对比。 */
        html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
        /* ==== 画布配色变量（Nexus Panel 移植新增）====
           原版全部硬编码深色以贴合 WPF 外壳；插件版要跟随 nexus 外壳的亮/暗主题，
           故抽成变量，由插件层通过门面 setCanvasTheme() 注入。默认值即原版深色，
           WPF 宿主不调用该门面时行为与原来完全一致。 */
        :root {
            --km-canvas-bg: #1E1E1E;        /* 画布底色 */
            --km-canvas-border: #3D4250;    /* 圆角内描边 */
            --km-panel-bg: #222225;         /* 搜索面板底 */
            --km-panel-head-bg: #26262B;    /* 搜索面板头部 */
            --km-panel-text: #CFCFCF;       /* 面板正文 */
            --km-panel-dim: #9A9AA0;        /* 面板次要文字 */
            --km-panel-hover: #2C2C33;      /* 面板条目悬停 */
            --km-panel-close-hover: #3A3A40;/* 关闭按钮悬停 */
            --km-loading-bg: rgba(27,27,31,.9);
            --km-loading-text: #AFAFAF;
        }
        #minder-container {
            position: absolute; inset: 0;
            border-radius: 8px;                 /* 与 WPF DarkFrame/KityMinderHost(8) 对齐 */
            background: var(--km-canvas-bg);
            overflow: hidden;                   /* 把画布内容裁剪进圆角内 */
            box-sizing: border-box;
            box-shadow: inset 0 0 0 1px var(--km-canvas-border);/* 1px 内描边，勾勒圆弧边界 */
        }
        /* 页面内加载遮罩（WebView2 内自绘，WPF 层遮罩会被 HWND 盖住四角变方角） */
        #km-loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--km-loading-bg);
            border-radius: 8px;
            overflow: hidden;
            color: var(--km-loading-text); font-size: 14px;
            z-index: 9999;
            pointer-events: none;
        }
        /* 隐藏鼠标按下时的蓝色选中框，桌面应用里很碍眼 */
        #minder-container * { user-select: none; }
        /* 搜索结果面板已移到外壳左侧（与文件库共用底框），画布内不再自绘浮层 */
    </style>
</head>
<body>
    <div id="minder-container"></div>

    <!-- 加载遮罩放进 WebView2 页面内：WPF 层遮罩会被 WebView2 独立 HWND 盖住四角产生方角，页面内自绘圆角+裁剪才可靠；每次导航/重载自动重现 -->
    <div id="km-loading">思维导图加载中…</div>

    <script defer src="kity.min.js"></script>
    <script defer src="kityminder.core.min.js"></script>
    <script>
    // ==== 宿主通信门面（必须最先执行：页面内所有通知都经由它发出）====
    // 原版只走 WebView2 的 window.chrome.webview；本页被嵌套进 Nexus Panel 插件层 iframe 后没有该对象，
    // 需回退到 postMessage 发给父窗口。此处收口，WPF 宿主（junction_link）行为完全不变。
    var KM_HOST_CHANNEL = 'kityminder-host-v1';
    function hostPost(msg) {
        var wv = (window.chrome && window.chrome.webview) || null;
        if (wv && typeof wv.postMessage === 'function') {
            try { wv.postMessage(msg); return; } catch (e) {}
        }
        try {
            if (window.parent && window.parent !== window) {
                var out = { channel: KM_HOST_CHANNEL };
                for (var k in msg) if (Object.prototype.hasOwnProperty.call(msg, k)) out[k] = msg[k];
                window.parent.postMessage(out, '*');
            }
        } catch (e) {}
    }
    // ==== A71 诊断捕获 ====
    // kityminder 跑在嵌套 iframe 里，这里的报错**不会**出现在外壳控制台 ——
    // 用户侧「点了没反应」却查不到任何线索。捕获后推给父窗口统一展示。
    // 必须在 kity 加载**之前**装好，否则初始化期间的报错抓不到。
    (function () {
        function send(level, message, stack) {
            try {
                hostPost({ type: 'diagnostic', level: level, message: String(message || '').slice(0, 2000), stack: String(stack || '').slice(0, 2000), at: Date.now() });
            } catch (e) {}
        }
        window.addEventListener('error', function (ev) {
            // 资源加载失败（img/script）时 ev.error 为空，只有 target ——
            // 那种也要报，否则图片 404 会毫无痕迹。
            if (ev && ev.target && ev.target !== window && ev.target.tagName) {
                send('error', '资源加载失败: ' + (ev.target.src || ev.target.href || ev.target.tagName), '');
                return;
            }
            send('error', (ev && ev.message) || '未知错误', (ev && ev.error && ev.error.stack) || '');
        }, true);   // 捕获阶段：才能收到资源加载错误（那类不冒泡）
        window.addEventListener('unhandledrejection', function (ev) {
            var r = ev && ev.reason;
            send('error', (r && r.message) || String(r || '未处理的 Promise 拒绝'), (r && r.stack) || '');
        });
        // console 包装：只截 error/warn，其余原样放行（不能影响正常调试输出）
        ['error', 'warn'].forEach(function (lv) {
            var orig = console[lv];
            console[lv] = function () {
                try {
                    var s = Array.prototype.map.call(arguments, function (a) {
                        if (a instanceof Error) return a.message;
                        try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch (e) { return String(a); }
                    }).join(' ');
                    if (s) send(lv === 'warn' ? 'warn' : 'error', s, '');
                } catch (e) {}
                if (typeof orig === 'function') orig.apply(console, arguments);
            };
        });
    })();

    // 嵌套 iframe 模式下由父窗口回执，配合 window.__resolveHost 完成 request/response 配对
    window.addEventListener('message', function (e) {
        var d = e && e.data;
        if (!d || d.channel !== KM_HOST_CHANNEL) return;
        if (d.type === 'response') {
            if (typeof window.__resolveHost === 'function') window.__resolveHost(d.id, d.result);
            return;
        }
        // 父窗口下发画布配色（插件层跟随外壳亮/暗主题）。
        // 本监听器早于 km 初始化注册，故先存起来：门面就绪后由 __applyPendingCanvasTheme 补套。
        if (d.type === 'theme') {
            window.__kmCanvasVars = d.vars || null;
            try {
                if (window.__minder && window.__minder.setCanvasTheme) {
                    window.__minder.setCanvasTheme(window.__kmCanvasVars);
                }
            } catch (e2) { /* 未就绪则等门面建好后再套 */ }
        }
    });

    // 首帧即圆角：两个库脚本 defer（后台加载、不阻塞首次绘制），初始化推迟到 DOMContentLoaded（此刻库已就绪）。
    // 前提：kity.min.js / kityminder.core.min.js 必须与 index.html 同目录存在，否则 defer 加载 404 → kityminder 未定义。
    document.addEventListener('DOMContentLoaded', function () {
    (function () {
        var km = window.__km = new kityminder.Minder({ renderTo: '#minder-container' });
        km.enable();                       // 进编辑态；只读场景换成 km.disable()
        // 布局过渡动画开关由设置面板控制（WPF 侧导航前注入 window.__kmAnimateLayout）：
        // 关闭（默认）时打开画布/展开收起不播节点扩散动画，直接显示最终布局；开启则保留 300ms 过渡。
        if (!window.__kmAnimateLayout) km.setOption('layoutAnimationDuration', 0);
        km.setTheme('fresh-blue');

        // ---- 文件附件支持（自注册 file 命令 + 节点右侧文件图标渲染器；点击图标经 WPF 打开文件）----
        // 必须在首次渲染（importJson）前把渲染器类挂进 _rendererClasses，节点渲染时才带出文件图标。
        (function () {
            var FileCommand = kity.createClass('fileCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value) n.setData('file', value);
                        else n.setData('file');
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('file')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('file') || '') : '';
                }
            });
            try { km._commands['file'] = new FileCommand(); } catch (e) {}

            // 视频附件（独立 data.video 字段）：与 file 区分，节点可同时挂文件与视频；路径进 xmind 时映射为 href
            var VideoCommand = kity.createClass('videoCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value) n.setData('video', value);
                        else n.setData('video');
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('video')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('video') || '') : '';
                }
            });
            try { km._commands['video'] = new VideoCommand(); } catch (e) {}

            /**
             * 按内核规则把原尺寸缩到 maxW×maxH 内。
             * 复刻内核 ImageCommand 里的算法 —— 换成自己写的一套会让同一张图
             * 在内核渲染器里算出不一样的大小。
             */
            function fitImageSize(w, h, maxW, maxH) {
                var r = w / h, mr = maxW / maxH;
                if (w > maxW && r > mr) { w = maxW; h = w / r; }
                else if (h > maxH) { h = maxH; w = h * r; }
                return { width: 0 | w, height: 0 | h };
            }

            /** 异步取真实尺寸；失败返回 null（保留占位尺寸，图照样能画） */
            function loadFitSize(url, m, cb) {
                try {
                    var mw = 200, mh = 200;
                    try { mw = m.getOption('maxImageWidth') || 200; } catch (e) {}
                    try { mh = m.getOption('maxImageHeight') || 200; } catch (e) {}
                    // typeof 对未声明变量是安全的（不抛 ReferenceError）——
                    // 测试用 new Function 跑这段时不一定注入 document
                    if (typeof document === 'undefined' || !document.createElement) { cb(null); return; }
                    var img = document.createElement('img');
                    img.onload = function () { cb(fitImageSize(img.width, img.height, mw, mh)); };
                    img.onerror = function () { cb(null); };
                    img.src = url;
                } catch (e) { cb(null); }
            }

            // ---- 同步 image 命令（**覆盖**内核自带的异步版本）----
            //
            // 内核的 image 命令是**异步**的：先 new Image() 加载出宽高，
            // 拿到后才 setData('image') / setData('imageSize')。实测后果：
            //
            //   1. 设完**立刻读**读不到 —— 面板刷新出来是空的；
            //      而侧栏 pageFile 里 images 是打开面板那一刻的快照，
            //      于是第二次添加时基数还是空的，新图把第一张**顶掉了**。
            //   2. 传 null 清除时 src=null 会 404，靠 onerror 回调生效，同样异步 ——
            //      images 已写好、image 还没清，两个字段并存 → 节点画出两张图。
            //
            // 另外内核 ImageRenderer 是 `if (imageSize) { ... }`：
            // **没有 imageSize 就完全不画**，所以自己写时必须连尺寸一起给。
            var ImageCommand = kity.createClass('imageCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    if (!value) {
                        // 清除：同步，不等回调
                        nodes.forEach(function (n) {
                            n.setData('image');
                            n.setData('imageTitle');
                            n.setData('imageSize');
                            n.render();
                        });
                        m.layout();
                        try { m.fire('saveScene'); } catch (e) {}
                        return;
                    }
                    // 设置：先同步写上（含占位尺寸）让**读取立即生效**，
                    // 真实尺寸异步补上后再 render 一次
                    var url = String(value);
                    var ph = { width: 120, height: 120 };
                    nodes.forEach(function (n) {
                        n.setData('image', url);
                        n.setData('imageSize', ph);
                        n.render();
                    });
                    m.layout();
                    try { m.fire('saveScene'); } catch (e) {}
                    loadFitSize(url, m, function (sz) {
                        if (!sz) return;
                        nodes.forEach(function (n) {
                            // 期间换了图就别覆盖 —— 异步回来时可能已经不是这张了
                            if (n.getData('image') !== url) return;
                            n.setData('imageSize', sz);
                            n.render();
                        });
                        m.layout();
                    });
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('image')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? { url: n.getData('image'), title: n.getData('imageTitle') } : { url: '', title: '' };
                }
            });
            // 覆盖内核同名命令 —— 必须在内核 _commands 建好之后（DOMContentLoaded 内）
            try { km._commands['image'] = new ImageCommand(); } catch (e) {}

            /* ---------------- 短文本节点的最小宽度 ----------------
             * 新建节点（文本为空）或只有一两个字的节点，内核算出来的框非常窄 ——
             * 窄到看着不像一个「节点」，点中也困难。
             *
             * 内核 TextRenderer 对空文本用 `[" "]`（一个空格）来测量，
             * 所以宽度就是一个空格宽；单字节点同理只有一个字的宽。
             *
             * 做法：包装 TextRenderer.update，把返回的 box 宽度**钳到下限**。
             * 只改宽度、不动 x —— center 渲染器本身按 box 居中，节点变宽后
             * 文本自然还是居中的。
             *
             * ⚠️ **不能**往 _rendererClasses 里加新渲染器来"撑宽"：
             * core 的 renderNodeBatch 按 b[0] 的渲染器数整体迭代，
             * 根节点与子节点渲染器数不一致时会取到 undefined 抛错，
             * 结果是子节点全部堆在画布中心（之前踩过，代价很大）。
             */
            /** 由测试直接取源码执行，所以写成命名函数而不是立即执行 */
            function patchMinTextWidth(minder) {
                var MIN_CHARS = 2;      // 最短按 2 个全角字符算
                var DEFAULT_FS = 16;    // 取不到字号时的回落

                /** 从已注册的渲染器类里找出 TextRenderer（按 kity 记的类名） */
                function findTextRenderer() {
                    var groups = minder._rendererClasses || {};
                    var keys = ['center', 'left', 'right', 'top', 'bottom', 'outside', 'outline'];
                    for (var i = 0; i < keys.length; i++) {
                        var arr = groups[keys[i]];
                        if (!arr) continue;
                        for (var j = 0; j < arr.length; j++) {
                            // kity.createClass 把名字记在 __KityClassName 上
                            if (arr[j] && arr[j].__KityClassName === 'TextRenderer') return arr[j];
                        }
                    }
                    return null;
                }

                var TR = findTextRenderer();
                if (!TR) return false;
                // 幂等：编辑器重复初始化时不再多套一层
                // （套两层会让下限被应用两次，宽度翻倍）
                if (TR.__kmMinWidthPatched) return false;
                TR.__kmMinWidthPatched = true;
                var origUpdate = TR.prototype.update;

                TR.prototype.update = function () {
                    var box = origUpdate.apply(this, arguments);
                    try {
                        // update(container, node, ...) —— node 是第 2 个参数
                        if (box && typeof box.width === 'number') {
                            var node = arguments[1];
                            var fs = DEFAULT_FS;
                            var got = node && node.getStyle ? node.getStyle('font-size') : null;
                            // getStyle 查不到时返回 null（不是 0），必须回落
                            if (got) fs = Number(got) || DEFAULT_FS;
                            var min = Math.round(MIN_CHARS * fs);
                            if (box.width < min) box.width = min;
                        }
                    } catch (e) { /* 拿不到就保持原宽度，不能让节点渲染失败 */ }
                    return box;
                };
                return true;
            }
            patchMinTextWidth(km);

            // 多图：data.images 存 **JSON 数组串**（dataURL 列表）。
            // 不能复用内核的 image 字段 —— 它是单值，内核渲染器会把数组串当 URL，直接破图。
            //
            // **1 张时走 image（内核渲染，图在节点框内）；≥2 张时走 images（横幅，框外紧贴下沿）。**
            //
            // 本命令**只管 images 字段，绝不动 image**。互斥逻辑统一放在
            // EditorBridge.setImages 里（那里知道全貌）。
            // 曾经把「清 image」写在这里，结果 setImage(url) 为了清横幅调
            // exec('images', null)，反过来把刚设好的 image 也清掉了 —— 图标设不上。
            // 一个命令同时改两个字段，调用方就很难组合出正确语义。
            var ImagesCommand = kity.createClass('imagesCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value) n.setData('images', value);
                        else n.setData('images');
                        n._kmImgIdx = 0;
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    return km.getSelectedNodes().length === 0 ? -1 : 0;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('images') || '') : '';
                }
            });
            try { km._commands['images'] = new ImagesCommand(); } catch (e) {}

            /**
             * 附件图标的取色。
             * ============================================================
             * node.getStyle('color') 在不少主题下返回 **null** —— core 的
             * getStyle 只在主题项里查得到才返回值，查不到就是 null。
             *
             * 而 kity 的 fill() 是：
             *     fill: function (a) {
             *         a && node.setAttribute('fill', a.toString());
             *         null === a && node.removeAttribute('fill');   // ← 关键
             *     }
             * 传 null 等于**删掉** fill 属性。SVG 缺 fill 时**默认黑色**，
             * 于是图标在深色画布上变成一块纯黑矩形 —— 既看不见形状也认不出
             * 是文件还是视频，正是「附加文件后是个黑框」的原因。
             *
             * 所以取不到主题色时必须回落到明确颜色，绝不能把 null 传进去。
             */
            function iconColor(node) {
                var c = null;
                try { c = node.getStyle('color'); } catch (e) { c = null; }
                return c || '#AEB6C4';
            }

            /** 附件名：节点里存的是 encodeRef 序列化后的 JSON 字符串 */
            function refName(raw) {
                if (!raw) return '';
                try {
                    var o = typeof raw === 'string' ? JSON.parse(raw) : raw;
                    if (o && o.n) return String(o.n);
                } catch (e) { /* 不是 JSON：C# 版留下的纯路径字符串，走下面兜底 */ }
                // 老式纯路径至少把文件名显示出来 —— 否则这类附件在画布上
                // 只能显示「文件附件」，用户根本认不出挂的是哪个
                return String(raw).split(/[\\/]/).pop() || '';
            }

            /* ---------------- 附件列表解析（与 io.js 的 decodeRefList 同构） ----------------
             * 编辑器是独立 HTML，import 不了 io.js，只能内联一份。
             * **两边行为必须一致**，测试里同时断言了两边（改一边忘另一边会立刻红）。
             * 规则：写一定是数组串，读两者都认（老数据是单对象串或纯路径串）。
             */

            /** 纯路径（C# 版遗留）→ 单元素列表 */
            function legacyRef(raw) {
                return [{ n: String(raw).split(/[\\/]/).pop() || String(raw), a: null, legacyPath: String(raw) }];
            }

            function refListOf(raw) {

                    if (t.charAt(0) === '[') {

                            if (p && p.length && Object.prototype.toString.call(p) === '[object Array]') {

                                for (var k = 0; k < p.length; k++) if (p[k]) out.push(p[k]);

                    try {
                        var o = JSON.parse(t);
                        if (o && typeof o === 'object') return [o];
                    } catch (e) { /* 纯路径 */ }

                if (v && typeof v === 'object') return [v];

            /**
             * 节点上的**横幅**图片列表（只读 `images`）。
             *
             * 刻意**不**读 `image`：单张图存在 `image` 里、由内核渲染在节点框内，
             * 这里再画一次就会变成同节点两张图。只有 ≥2 张时 `images` 才有值
             * （见 ImagesCommand），此时才由横幅绘制。

            /* ---------------- DOM → 节点 映射（拖放命中测试用） ---------------- */

            // 但那是 kity Group 对象；拖放事件里拿到的是 SVG 元素，从 DOM 反查不到。

            /* ---------------- 附件名文字标签（画布上可见） ---------------- */

             * 附件引用 → 画布标签文字（纯函数，可测）。

            }

            /** 标签字号：跟随节点字号但更小，钳在 [9,13] */
            function attachmentFontSize(node) {
                var fs = 14;
                try { fs = parseFloat(node.getStyle('font-size')) || 14; } catch (e) { fs = 14; }
                return Math.max(9, Math.min(13, Math.round(fs * 0.75)));
            }

            var FileIcon = kity.createClass('FileIcon', {
                base: kity.Group,
                constructor: function () {
                    this.callBase();
                    this.width = 16;
                    this.height = 20;
                    // **必须是 'none' 不能用 'transparent'**：SVG 1.1 的 fill 属性
                    // 不接受 transparent 这个 CSS 关键字，渲染器认不出来就回退成
                    // 默认黑色 —— 整个 16×20 的矩形糊成一个黑块，把线全盖住。
                    // none 是标准值，所有渲染器都认。
                    // ⚠️ 这里曾经用的是 CSS 关键字 transparent，与上面注释**自相矛盾**：
                    // SVG 1.1 的 fill 属性不认 transparent 这个 CSS 关键字，
                    // 渲染器回退成默认黑色 —— 于是文件附件在画布上就是一块
                    // 16×20 的**纯黑矩形**，把折角和描边全盖住（"黑图标"）。
                    // 只有鼠标移上去再移开（mouseout 会设成 none）才恢复正常，
                    // 所以表现为「一开始是黑的，划一下就好了」。
                    // rect 是**悬停高亮框**，几何必须罩住下面 outline 的实际范围。
                    // outline 的路径是 x∈[-8,3] / y∈[-10,10]（11×20，原点不在中心），
                    // 而这里原先写的是 (16,20, 0,-10) —— 从原点向右延伸 16px，
                    // 与图标本体**完全错位**，还盖到右边的文件名上：
                    // 表现为「悬停出现一个透明小框，位置不对、把文字压住」。
                    // 取 [-10,5] × [-10,10]：罩住图标并留 2px 余量，像按钮的热区。

                    // 开放线段也当闭合区域填掉，看不出是「文件」。
                    // 轮廓带一层淡填充 —— 纯描边在深色画布上太细，认不出形状。
                    this.outline = (new kity.Path).setPathData('M-8,-10 L-1,-10 L3,-6 L3,10 L-8,10 Z')

                    this.fold = (new kity.Path).setPathData('M-1,-10 L-1,-6 L3,-6')

                base: kity.Group,

                    this.height = 16;

            // 不能把 FileRenderer 挂进 _rendererClasses['right']：core 的 renderNodeBatch 按 b[0] 节点

            // 在 "e.contentBox=..." 处抛 "Cannot set properties of undefined (setting 'contentBox')"，
            // 使子节点无法布局、全部堆在画布中心。改为 noderender 事件把文件图标作为独立形状绘制到节点渲染层，
            // 与下方分组边界/组标签钩子同构，既保留文件图标又不扰动渲染器数组。
            try {
                // 文件/视频图标各自独立绘制（noderender 内一起清理重建），节点可同时挂两者：
                // 文件在 baseX，存在文件时视频右移 20 与文件并排，互不覆盖。
                km.on('noderender', function (e) {
                    var node = e && e.node;
                    if (!node) return;
                    try {
                        var old = node._kmFileIcon, oldv = node._kmVideoIcon;
                        if (old) { if (old.remove) old.remove(); node._kmFileIcon = null; }
                        if (oldv) { if (oldv.remove) oldv.remove(); node._kmVideoIcon = null; }
                        var oldLabels = node._kmLabels || [];
                        for (var li = 0; li < oldLabels.length; li++) {

                            }
                        }
                        node._kmLabels = null;
                        var box = node.getContentBox();
                        if (!box) return;

                        var y = box.cy;
                        var rc = node.getRenderContainer();
                        if (!rc || !rc.appendShape) return;
                        // 拖放命中测试要用：DOM 事件里拿到的是 SVG 元素，
                        // 内核的 rc.minderNode 挂在 kity Group 对象上、DOM 上反查不到，
                        // 所以这里另建 DOM → node 的映射。用 WeakMap：
                        // 节点销毁后条目自动消失，不会随每次重渲累积。

                            nodeDomMap.set(node, rc.node);

                            // 悬停提示：光看图标认不出挂的是哪个文件

                                    var t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                                    t.textContent = tip;

                            icon.on('mousedown', function (ev) {
                                ev.preventDefault();
                                if (path) { try { hostPost({ type: 'openfile', path: path }); } catch (e2) {} }
                            });
                            rc.appendShape(icon);
                        }
                        /* ================= 附件区（节点框**下沿之外**） =================
                         * 一个节点可挂多张图片、多个视频、多个文件：
                         *   图片 → 横幅（多张可左右切换）
                         *   视频 → 一张缩略图卡片 + 右上角数字角标（总数）
                         *   文件 → 每行一个（图标 + 文件名）
                         *
                         * 为什么画在框外而不是框内：kityminder 的 contentBox 由
                         * _rendererClasses 计算，往里加渲染器会让 renderNodeBatch 按
                         * b[0] 的渲染器数整体迭代时取到 undefined（"Cannot set properties

                        var push = function (sh) {

                            return sh;
                        };
                        var top = box.bottom + 6;
                        var cx = box.cx;

                        /* ---- 图片横幅（多张可切换） ---- */
                        var imgs = imageListOf(node);
                        if (imgs.length) {
                            var ii = node._kmImgIdx || 0;
                            if (!(ii >= 0 && ii < imgs.length)) ii = 0;
                            var iw = Math.max(64, Math.min(96, box.width || 96));
                            var ih = 60;
                            var ix = cx - iw / 2;
                            push(new kity.Rect(iw, ih, ix, top, 4)
                                .fill('rgba(255,255,255,0.07)').stroke(color, 1));
                            try {
                                var im = new kity.Image(imgs[ii], iw - 6, ih - 6, ix + 3, top + 3);

                            } catch (e3) {}

                                // 左右箭头：切换当前图（循环）
                                var arrowL = (new kity.Path).setPathData(
                                    'M' + (ix + 12) + ',' + my + ' L' + (ix + 20) + ',' + (my - 6) +
                                    ' L' + (ix + 20) + ',' + (my + 6) + ' Z')
                                    .fill('rgba(0,0,0,0.55)').stroke('rgba(255,255,255,0.85)', 1);
                                var arrowR = (new kity.Path).setPathData(
                                    'M' + (ix + iw - 12) + ',' + my + ' L' + (ix + iw - 20) + ',' + (my - 6) +
                                    ' L' + (ix + iw - 20) + ',' + (my + 6) + ' Z')
                                    .fill('rgba(0,0,0,0.55)').stroke('rgba(255,255,255,0.85)', 1);

                                        if (ev.stopPropagation) ev.stopPropagation();

                                var cnt = new kity.Text((ii + 1) + '/' + imgs.length);
                                try {
                                    cnt.setSize(9).fill(color).setTextAnchor('middle');
                                    cnt.setStyle('pointer-events', 'none');
                                    cnt.setTranslate(cx, top + ih - 4);
                                } catch (e3) {}

                            if (!(vi >= 0 && vi < vids.length)) vi = 0;
                            var vcur = vids[vi] || {};

                                .fill('#1B1B1F').stroke(color, 1);
                            bindAttach(vcard, 'video', vi, vcur, refName(vcur) || '视频', node);

                            // 首帧缩略图：附加时生成并存进 ref.t（同步可读，不阻塞渲染）

                                    var vt = new kity.Image(vcur.t, vw - 6, vh - 6, vx + 3, top + 3);

                            push(badge);
                            // 数字用深色（压在浅色角标圆上）—— 与节点同色在浅色主题上会看不见
                            var bnum = new kity.Text(String(vids.length));
                            try {
                                bnum.setSize(10).fill('#1B1B1F').setTextAnchor('middle');

                            } catch (e3) {}
                            push(bnum);
                            if (vids.length > 1) {
                                // 多个视频要能切换，否则第 2 个起永远点不到。
                                // 角标已经占用「总数」，当前序号放左下角小字。
                                var vseq = new kity.Text((vi + 1) + '/' + vids.length);
                                try {
                                    vseq.setSize(9).fill('rgba(255,255,255,0.92)').setTextAnchor('start');
                                    vseq.setStyle('pointer-events', 'none');
                                    vseq.setTranslate(vx + 4, top + vh - 4);
                                } catch (e3) {}
                                push(vseq);
                                var vmy = top + vh / 2;
                                var vaL = (new kity.Path).setPathData(
                                    'M' + (vx + 10) + ',' + vmy + ' L' + (vx + 18) + ',' + (vmy - 6) +
                                    ' L' + (vx + 18) + ',' + (vmy + 6) + ' Z')
                                    .fill('rgba(0,0,0,0.55)').stroke('rgba(255,255,255,0.85)', 1);
                                var vaR = (new kity.Path).setPathData(
                                    'M' + (vx + vw - 10) + ',' + vmy + ' L' + (vx + vw - 18) + ',' + (vmy - 6) +
                                    ' L' + (vx + vw - 18) + ',' + (vmy + 6) + ' Z')
                                    .fill('rgba(0,0,0,0.55)').stroke('rgba(255,255,255,0.85)', 1);

                                    var sh = pair[0], d = pair[1];
                                    sh.setStyle('cursor', 'pointer');
                                    sh.on('mousedown', function (ev) {
                                        ev.preventDefault();
                                        if (ev.stopPropagation) ev.stopPropagation();
                                        var cur = node._kmVidIdx || 0;
                                        node._kmVidIdx = (cur + d + vids.length) % vids.length;
                                        node.render();
                                    });
                                    push(sh);
                                });

                        }

                        var fils = refListOf(node.getData('file'));
                        for (var fi = 0; fi < fils.length; fi++) {

                            var fic = new FileIcon();
                            fic.paint(color);
                            fic.setTranslate(cx - 46, fy);
                            bindAttach(fic, 'file', fi, fils[fi], attachmentLabel(fils[fi], '附件'), node);
                            push(fic);
                            var fn = new kity.Text(attachmentLabel(fils[fi], '文件附件'));
                            try {
                                fn.setSize(attachmentFontSize(node)).fill(color).setTextAnchor('start');
                                fn.setStyle('pointer-events', 'none');
                                fn.setTranslate(cx - 34, fy + 4);
                            } catch (e3) {}
                            push(fn);
                            // 行距必须 ≥ 图标高度（20）：写 17 时相邻两行的图标
                            // 上下各占 20，重叠 3px —— 用户看到的就是「两个图标叠在一起」。

            /* ---------------- 文件拖放附加 ----------------

             *

             * 1. **dragover 必须 preventDefault**，否则浏览器不派发 drop（默认行为是打开文件）
             * 2. **原生拖拽期间不派发 mousemove**，所以不能靠 km 的 mousemove 拿到

             */

            /* ---------------- 附件在节点间拖拽移动 ----------------
             * 点一下 = 打开；按住拖到别的节点 = 移过去。
             *
             * 不用 HTML5 Drag & Drop（与页签拖拽同样的理由）：

             * 2. 原生拖拽期间不派发 mousemove，拿不到「当前悬停的是哪个节点」

             */

            var attGhost = null;     // 跟随指针的浮层
            var attHi = null;        // 目标节点高亮框
            var attHiNode = null;

            function attGhostEl() {
                if (!attGhost) {
                    attGhost = document.createElement('div');
                    attGhost.className = 'mm-att-ghost';

                    attGhost.style.pointerEvents = 'none';
                    document.body.appendChild(attGhost);
                }
                return attGhost;
            }

            function attHiEl() {
                if (!attHi) {
                    attHi = document.createElement('div');
                    attHi.className = 'mm-att-hi';
                    attHi.style.pointerEvents = 'none';
                    document.body.appendChild(attHi);
                }
                return attHi;
            }

            /** 把高亮框套在目标节点上；传 null 收起 */
            function attHighlight(node) {
                var el = attHiEl();
                if (!node) {
                    el.style.display = 'none';
                    attHiNode = null;
                    return;
                }
                // 拖到自己身上不给高亮 —— 高亮了像是「可以放」，实际会空操作
                if (attDrag && node === attDrag.node) {
                    el.style.display = 'none';
                    attHiNode = null;
                    return;
                }
                var dom = nodeDomMap.get(node);
                if (!dom || !dom.getBoundingClientRect) {
                    el.style.display = 'none';
                    attHiNode = null;
                    return;
                }
                var r = dom.getBoundingClientRect();
                if (!r.width && !r.height) {
                    el.style.display = 'none';
                    attHiNode = null;
                    return;
                }
                el.style.display = 'block';
                el.style.left = (r.left - 3) + 'px';
                el.style.top = (r.top - 3) + 'px';
                el.style.width = (r.width + 6) + 'px';
                el.style.height = (r.height + 6) + 'px';
                attHiNode = node;
            }

            function attEndDrag() {
                if (attGhost) attGhost.style.display = 'none';
                attHighlight(null);
                var d = attDrag;
                attDrag = null;
                return d;
            }

            /**
             * 给一个附件图形绑定「点击打开 + 拖拽移动」。
             * 替换掉原先只处理点击的 mousedown。
             */

            /** 提成的命名函数：既便于注册，也便于测试直接取源码跑 */
            function onAttMove(e) {
                if (!attDrag) return;
                var dx = e.clientX - attDrag.x0;
                var dy = e.clientY - attDrag.y0;
                if (!attDrag.moved) {
                    // 死区：**没有它就没有单击** —— 手抖 1px 也算拖拽的话，
                    // 「点一下打开」永远触发不了
                    if (Math.abs(dx) + Math.abs(dy) < ATT_DRAG_DEAD) return;
                    attDrag.moved = true;
                    var g = attGhostEl();
                    g.textContent = attDrag.label;
                    g.style.display = 'block';
                }
                var g2 = attGhostEl();
                g2.style.left = (e.clientX + 12) + 'px';
                g2.style.top = (e.clientY + 12) + 'px';
                var target = nodeFromDom(document.elementFromPoint(e.clientX, e.clientY));
                attHighlight(target);
            }

            function onAttUp(e) {
                var d = attEndDrag();
                if (!d) return;
                if (!d.moved) {
                    // 没超过死区 = 单击：走原来的打开行为
                    openAttach(d.node, d.kind, d.index, d.ref);
                    return;
                }
                var target = nodeFromDom(document.elementFromPoint(e.clientX, e.clientY));
                if (!target) {
                    // 拖到空白处要**说出来**，否则用户以为坏了
                    hostPost({ type: 'attachmiss' });
                    return;
                }
                if (target === d.node) return;   // 拖回自己，什么都不做
                hostPost({
                    type: 'moveattach',
                    kind: d.kind, index: d.index,
                    fromId: d.fromId,
                    toId: (target.data && target.data.id) || '',
                });
            }

            document.addEventListener('mousemove', onAttMove);
            document.addEventListener('mouseup', onAttUp);

            /**
             * 打开某个节点上的一个附件。
             *
             * 打开前**先选中该节点**：宿主的命令一律作用于「当前选中节点」，
             * 而点附件本身不会改变选中态（mousedown 被 preventDefault 了）。
             * 不选中会导致后续「设为缩略图」写到别的节点上。
             */
            function openAttach(node, kind, index, raw) {
                try { km.select(node, true); } catch (e) {}
                // 点画布上的图时把**整组**一起发给宿主：预览里要能左右/滚轮切换。
                // 只发单张的话，看下一张就得关掉浮层回来再点一次。
                //
                // 只在这条路径带上（图片是 dataURL、不进资产库），
                // 视频/文件仍然只发引用 —— 它们本体在 IndexedDB，
                // 整包发过来等于把整个文件复制一遍。
                var list = null;
                if (kind === 'image') {
                    try { list = imageListOf(node); } catch (e) { list = null; }
                    if (list && list.length < 2) list = null;
                }
                hostPost({
                    type: 'openattach',
                    kind: kind, index: index, raw: raw,
                    nodeId: (node && node.data && node.data.id) || '',
                    list: list,
                });
            }

            /** 从 DOM 往上找所属节点（最多 50 层，防死循环） */
            function nodeFromDom(el) {
                var cur = el;
                var guard = 0;
                while (cur && guard++ < 50) {
                    var n = domNodeMap.get(cur);
                    if (n) return n;
                    cur = cur.parentNode;
                }
                return null;
            }

            /**
             * 拖拽里有没有文件。
             * 必须判断：拖节点文字、拖浏览器里的选中内容也会触发 dragover，
             * 不区分的话会把画布内部的正常拖拽也拦下来。
             */
            function dragHasFiles(dt) {
                if (!dt || !dt.types) return false;
                for (var i = 0; i < dt.types.length; i++) {
                    if (dt.types[i] === 'Files') return true;
                }
                return false;
            }

            var dropTarget = null;

            /** 高亮：直接选中该节点，复用内核自己的选中框，零坐标成本 */
            function markTarget(node) {
                if (dropTarget === node) return;
                dropTarget = node;
                if (!node) return;
                try { km.select(node, true); } catch (e) {}
            }
            function clearTarget() {
                if (!dropTarget) return;
                dropTarget = null;
            }

            try {
                var dropRoot = document.getElementById('minder-container') || document.body;
                dropRoot.addEventListener('dragenter', function (e) {
                    if (!dragHasFiles(e.dataTransfer)) return;
                    e.preventDefault();
                });
                dropRoot.addEventListener('dragover', function (e) {
                    if (!dragHasFiles(e.dataTransfer)) return;
                    e.preventDefault();                       // 不 preventDefault 就没有 drop
                    try { e.dataTransfer.dropEffect = 'copy'; } catch (e2) {}
                    markTarget(nodeFromDom(e.target));
                });
                dropRoot.addEventListener('dragleave', function (e) {
                    if (!dragHasFiles(e.dataTransfer)) return;
                    clearTarget();
                });
                dropRoot.addEventListener('drop', function (e) {
                    if (!dragHasFiles(e.dataTransfer)) return;
                    e.preventDefault();
                    clearTarget();
                    var node = nodeFromDom(e.target);
                    if (!node) {
                        // 空白处：明确告知，否则用户只会觉得「拖了没反应」
                        hostPost({ type: 'dropmiss' });
                        return;
                    }
                    var files = [];
                    var fl = e.dataTransfer.files;
                    for (var i = 0; i < (fl ? fl.length : 0); i++) files.push(fl[i]);
                    if (!files.length) return;
                    // 先选中：插件层的命令一律作用于「当前选中节点」，
                    // 且存资产是异步的，期间选中态若变了会挂错节点
                    try { km.select(node, true); } catch (e2) {}
                    hostPost({
                        type: 'dropfiles',
                        files: files,
                        nodeId: (node.data && node.data.id) || '',
                    });
                });
            } catch (e) {}
        })();

        // ---- 选中框视觉同步：强制重渲「从选中变为未选中」的节点，清掉点空白处后可能残留的高亮矩形 ----
        // 内核取消选中时理论上会对被移除节点重渲；偶发漏渲会让高亮残留（纯显示问题，功能已失效）。
        // 这里在任何选中变更后，把上一步选中、现在未选中的节点再 render() 一次，保证显示与选中态一致。
        (function () {
            var last = [];
            function curSel() { try { return km.getSelectedNodes().slice(); } catch (e) { return []; } }
            function sync() {
                var now = curSel();
                var removed = [];
                last.forEach(function (n) {
                    if (n && n.render && now.indexOf(n) === -1) removed.push(n);
                });
                last = now;
                removed.forEach(function (n) { try { n.render(); } catch (e) {} });
            }
            try { km.on('selectionchange', sync); } catch (e) {}
            try { km.on('selectionclear', sync); } catch (e) {}
        })();
        // 启动时给一个默认根节点，避免画布空白
        km.importJson({ root: { data: { text: '中心主题' } } });

        // ---- 容器尺寸变化后重排：WebView2 在 Popup 弹出过程中首帧容器尺寸可能偏小，
        // kityminder core 不监听 resize，节点就困在首帧小范围里（视觉：节点挤在画布中间、四周留白）。
        // 尺寸显著变化（或首次拿到足够尺寸）时用当前容器重排一次，让布局占满画布。
        (function () {
            var lastW = 0, lastH = 0, done = false;
            function ensureRelayout() {
                var c = document.getElementById('minder-container');
                if (!c) return;
                var w = c.clientWidth, h = c.clientHeight;
                if (w <= 0 || h <= 0) return;
                var changed = (lastW > 0 && lastH > 0) && (w !== lastW || h !== lastH);
                lastW = w; lastH = h;
                if ((changed || !done) && (w > 300 && h > 200)) {
                    done = true;
                    try { km.refresh(); } catch (e) {}
                }
            }
            window.addEventListener('resize', ensureRelayout);
            setInterval(ensureRelayout, 400);
        })();

        // ---- 删除线支持（core 无内置命令：自注册 strikethrough 命令 + 文本样式 hook）----
        (function () {
            var StrikethroughCommand = kity.createClass('strikethroughCommand', {
                base: kityminder.Command,
                execute: function (m) {
                    var nodes = m.getSelectedNodes();
                    var on = this.queryState() != 1;
                    nodes.forEach(function (n) {
                        if (on) n.setData('font-strikethrough', true);
                        else n.setData('font-strikethrough');
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes(), result = 0;
                    if (nodes.length === 0) return -1;
                    nodes.forEach(function (n) {
                        if (n && n.getData('font-strikethrough')) { result = 1; return false; }
                    });
                    return result;
                }
            });
            try { km._commands['strikethrough'] = new StrikethroughCommand(); } catch (e) {}
            var strikeHookDone = false;
            function tryRegisterStrikeHook() {
                if (strikeHookDone) return;
                try {
                    var root = km.getRoot && km.getRoot();
                    var tr = root && root.getRenderer && root.getRenderer('TextRenderer');
                    var TR = tr && tr.constructor;
                    if (!TR || !TR.registerStyleHook) return;
                    TR.registerStyleHook(function (node, textGroup) {
                        var strike = node.getData && node.getData('font-strikethrough');
                        textGroup.eachItem(function (i, t) {
                            if (t && t.setAttr) t.setAttr('text-decoration', strike ? 'line-through' : 'none');
                        });
                    });
                    strikeHookDone = true;
                } catch (e) {}
            }
            try { km.on('noderender', tryRegisterStrikeHook); } catch (e) {}
            tryRegisterStrikeHook();
        })();

        // ---- 文字对齐支持（core 无内置命令：自注册 textalign 命令 + 文本样式 hook）----
        (function () {
            var TextAlignCommand = kity.createClass('textalignCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        if (value === 'left') n.setData('text-align');
                        else n.setData('text-align', value);
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes();
                    if (nodes.length === 0) return -1;
                    var result = 0;
                    nodes.forEach(function (n) {
                        if (n && n.getData('text-align')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('text-align') || 'left') : 'left';
                }
            });
            try { km._commands['textalign'] = new TextAlignCommand(); } catch (e) {}
            var alignHookDone = false;
            function tryRegisterAlignHook() {
                if (alignHookDone) return;
                try {
                    var root = km.getRoot && km.getRoot();
                    var tr = root && root.getRenderer && root.getRenderer('TextRenderer');
                    var TR = tr && tr.constructor;
                    if (!TR || !TR.registerStyleHook) return;
                    TR.registerStyleHook(function (node, textGroup) {
                        var align = node.getData && node.getData('text-align');
                        if (!align || align === 'left') {
                            textGroup.eachItem(function (i, t) {
                                if (t && t.setX) t.setX(0);
                            });
                            return;
                        }
                        var widths = [];
                        textGroup.eachItem(function (i, t) {
                            var w = 0;
                            try { w = t.getBoundaryBox ? t.getBoundaryBox().width : 0; } catch (e) {}
                            widths.push(w);
                        });
                        var maxW = 0;
                        for (var i = 0; i < widths.length; i++) if (widths[i] > maxW) maxW = widths[i];
                        textGroup.eachItem(function (i, t) {
                            var w = widths[i] || 0, x = 0;
                            if (align === 'center') x = (maxW - w) / 2;
                            else if (align === 'right') x = maxW - w;
                            if (t && t.setX) t.setX(x);
                        });
                    });
                    alignHookDone = true;
                } catch (e) {}
            }
            try { km.on('noderender', tryRegisterAlignHook); } catch (e) {}
            tryRegisterAlignHook();
        })();

        // ---- 文字垂直对齐支持（自注册 valign 命令 + 文本样式 hook：文字在节点内容盒内靠上/居中/靠下）----
        // 说明：节点内容盒紧贴文本时（无图片）三种对齐无可见差异；节点带图片时文本默认沉底，
        // 靠上/居中/靠下会把文本在「图片+文本」组成的内容盒内上移/居中/下沉。
        (function () {
            var ValignCommand = kity.createClass('valignCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    var nodes = m.getSelectedNodes();
                    nodes.forEach(function (n) {
                        n.setData('vertical-align', value);
                        n.render();
                    });
                    m.layout();
                },
                queryState: function () {
                    var nodes = km.getSelectedNodes();
                    if (nodes.length === 0) return -1;
                    var result = 0;
                    nodes.forEach(function (n) {
                        if (n && n.getData('vertical-align')) { result = 1; return false; }
                    });
                    return result;
                },
                queryValue: function () {
                    var n = km.getSelectedNode();
                    return n ? (n.getData('vertical-align') || 'middle') : 'middle';
                }
            });
            try { km._commands['valign'] = new ValignCommand(); } catch (e) {}
            // 层级垂直偏移微调查表（临时调试工具）：key=节点层级(center中心/child一级/deep更深)，
            // align=靠上top/居中middle/靠下bottom。值叠加到基础对齐落点上，保存在 localStorage 供
            // WPF 偏移滑块读写；确定「看着正确」的位置后固化为默认规则并删除本微调面板。
            var VO_KEY = 'km_valign_offset_v1';
            window.__valignOffset = {
                center: { top: 0, middle: 0, bottom: 0 },
                child: { top: 0, middle: 0, bottom: 0 },
                deep: { top: 0, middle: 0, bottom: 0 }
            };
            try {
                var voSaved = JSON.parse(localStorage.getItem(VO_KEY) || 'null');
                if (voSaved && voSaved.center && voSaved.child && voSaved.deep) window.__valignOffset = voSaved;
            } catch (eo) {}
            function voLevelKey(node) {
                var lv = node.getLevel ? node.getLevel() : 0;
                return lv <= 0 ? 'center' : (lv === 1 ? 'child' : 'deep');
            }
            function voOffset(node, va) {
                try { var bx = window.__valignOffset[voLevelKey(node)]; return (bx && bx[va]) || 0; } catch (e3) { return 0; }
            }
            var ValignOffsetCommand = kity.createClass('valignoffsetCommand', {
                base: kityminder.Command,
                execute: function (m, value) {
                    if (!value || !value.type || !value.align) return;
                    var bx = window.__valignOffset[value.type];
                    if (!bx) return;
                    bx[value.align] = Math.round(Number(value.px) || 0);
                    try { localStorage.setItem(VO_KEY, JSON.stringify(window.__valignOffset)); } catch (e4) {}
                    try { km.getRoot().traverse(function (nd) { if (nd.render) nd.render(); }); } catch (e5) {}
                },
                queryState: function () { return 0; },
                queryValue: function () { return window.__valignOffset; }
            });
            try { km._commands['valignoffset'] = new ValignOffsetCommand(); } catch (e6) {}
            // 平移改在 noderender 之后做。曾用 TextRenderer 文本样式 hook（registerStyleHook）实现，
            // 但在该时机 node.getContentBox() 尚未合并图片等其余 renderer 的内容盒，内容盒高取不到，
            // 偏移恒为 0 -> 垂直对齐形同虚设；且 kity 的 transform 是 {translate:[x,y]}，原实现读
            // textGroup.transform.matrix.f 也永远是 0。noderender 在整节点渲染完成后触发，此刻
            // getContentBox() 与文本组边界均已确定，setTranslate(0,dy) 为绝对设定、每次内核复位后重设，幂等。
            // dy = 基础对齐落点 + 该层级该对齐的微调偏移。
            // ---- 文字垂直居中：改用**真实测量**，不再吃内核的经验系数 ----
            //
            // 内核 TextRenderer.update 最后一行是
            //     a.setTranslate(0, d * fontSize)
            // d 来自一张硬编码的「浏览器 × 平台 × 字体族」经验表：
            //     { safari:{...}, ie:{...}, edge:{...}, sg:{...},
            //       chrome:{ Mac:{...}, Win:{ "微软雅黑,Microsoft YaHei":-.15, ..., default:-.15 }, ... },
            //       firefox:{...} }
            // 三个前提在 WebView2 里都不成立：
            //   ① 主题里**根本没有 font-family**（fresh-*/classic/snow/fish 的定义
            //      只有 root/main/sub-font-size 与 line-height），所以取到的
            //      font-family 恒为 "default"，永远命中那一个经验值；
            //   ② d 只乘 font-size，**不含行数与行高** —— 多行节点必然偏；
            //   ③ 该表是按「浏览器 + 微软雅黑 + dominant-baseline:text-before-edge
            //      表示文本顶部」标定的。Chromium 一旦把 text-before-edge 当基线处理，
            //      setY 的含义就从「顶部」变成「基线」，整套计算错位。
            // 结果就是**不同主题偏差不同**（root 字号 16 vs 24、行数不同），
            // 表现为中央主题 / 子主题 / 更下级主题有的偏高、有的偏低。
            //
            // 修法：不再猜，直接测。SVG 的 getBBox() **不含元素自身的 transform**，
            // 拿到的正是「尚未平移」的真实文本边界，据此把文本中心对齐到内容盒中心。
            // 这样无论字体、字号、行数、baseline 语义如何，都自动居中。
            //
            // 抽成全局纯函数是为了可测（jsdom 里 getBBox 恒为 0，测不了真实渲染）。
            window.__kmTextDy = function (bb, cbox, va, off) {
                if (!bb || !bb.height || !cbox || !cbox.height) return null;   // 测不到 → null，调用方保持内核落点
                var dy;
                if (va === 'top') dy = cbox.y - bb.y;
                else if (va === 'bottom') dy = (cbox.y + cbox.height) - (bb.y + bb.height);
                else dy = (cbox.y + cbox.height / 2) - (bb.y + bb.height / 2);
                return dy + (Number(off) || 0);
            };
            // 默认对齐：纯文本节点（内容盒几乎就是文本盒）做**视觉居中**；
            // 节点带图片等额外内容时保留内核的沉底语义，不改动带图节点的既有布局。
            window.__kmDefaultValign = function (cbox, bb) {
                if (!cbox || !bb) return 'middle';
                return (cbox.height - bb.height) > 1 ? 'bottom' : 'middle';
            };
            //
            // 注意：原实现开头有 `if (!va) return;` —— 只有**显式设过 vertical-align**
            // 的节点才会被校正。而 Web 版没有任何入口去设这个值（panels.js / index.js
            // 里都没有 valign 命令），所以它对所有节点都是死的，
            // 三级微调表 __valignOffset 也就永远读不到。这正是"原源码做过偏移、
            // 现在没生效"的那一环。现在默认节点也进校正分支，微调表才真正可用。
            var valignBindDone = false;
            function bindValign() {
                if (valignBindDone) return;
                try {
                    km.on('noderender', function (e) {
                        var node = e && e.node;
                        if (!node || !node.getData || !node.getRenderer) return;
                        try {
                            var tg = node.getRenderer('TextRenderer').getRenderShape();
                            if (!tg || !tg.getBoundaryBox || !tg.setTranslate) return;
                            var cbox = node.getContentBox();
                            if (!cbox || !cbox.height) return;
                            var bb = tg.getBoundaryBox();
                            var va = node.getData('vertical-align') || window.__kmDefaultValign(cbox, bb);
                            var dy = window.__kmTextDy(bb, cbox, va, voOffset(node, va));
                            // dy 为 null 表示测不到真实边界 —— 此时**绝不能**设 0，
                            // 那会把内核的经验补偿整个抹掉，文字反而更偏
                            if (dy == null) return;
                            tg.setTranslate(0, dy);
                        } catch (e2) {}
                    });
                    valignBindDone = true;
                } catch (e0) {}
            }
            try { km.on('noderender', bindValign); } catch (e0) {}

        // Enter/失焦应用（走 core 的 text 命令并重排布局），Esc 取消。
        var editLayer = null;

            editLayer = null;

                    if (node && km.getSelectedNode && km.getSelectedNode() !== node) km.select(node, true);
                    km.execCommand('text', v);

            } catch (e) {}

        }

             * 缩放对齐（关键修复）
             * ------------------------------------------------------------

             * 而 getComputedStyle().fontSize 是 **CSS 像素**（缩放是 transform，

             * 画布缩到 50%，节点文字在屏幕上只有 7px，编辑层仍按 14px 渲染。

                'user-select:text;-webkit-user-select:text;' +
                'color:' + (ws ? ws.color : '#e6e6e6') + ';' +
                'font-family:' + (ws ? ws.fontFamily : '"Segoe UI","Microsoft YaHei",sans-serif') + ';' +
                'font-size:' + scaledFs + 'px;' +
                'font-weight:' + (ws ? ws.fontWeight : 'normal') + ';' +
                'font-style:' + (ws ? ws.fontStyle : 'normal') + ';' +

                    if (!kids || !kids.length) return;

                } catch (e) {}
            }

            /**
             * 折叠 / 展开单个节点（不递归、不改变选中）。

             */
            function setFold(n, wantExpand) {
                if (!n) return false;
                try {
                    if (n.isLeaf && n.isLeaf()) return false;   // 叶子无事可做
                    if (wantExpand) n.expand(); else n.collapse();
                    n.renderTree(); km.layout(100); km.fire('contentchange');
                    return true;
                } catch (e) { return false; }
            }

            kmShortcut('up', function () { navNode('up'); });
            kmShortcut('down', function () { navNode('down'); });
            kmShortcut('left', function () { navNode('left'); });
            kmShortcut('right', function () { navNode('right'); });

            // ---- Ctrl+← 折叠 / Ctrl+→ 展开（对齐 XMind）----
            // 注：内核键码解析里 ctrl 与 cmd 等价（case "ctrl": case "cmd":，
            // 且事件侧判定为 a.ctrlKey || a.metaKey），所以 macOS 上按 Cmd+←/→ 同样生效 ——
            // 这点正好避开 macOS 把 Ctrl+←/→ 占用为「切换桌面」的系统快捷键。
            kmShortcut('ctrl+left', function () { setFold(km.getSelectedNode(), false); });
            kmShortcut('ctrl+right', function () { setFold(km.getSelectedNode(), true); });

            // ---- / 折叠或展开选中节点（来回切换）----
            // 同样只有键码(191)被登记，行为未实现。
            kmShortcut('/', function () {
                try {
                    var n = km.getSelectedNode();
                    if (!n || (n.isLeaf && n.isLeaf())) return;
                    setFold(n, !!(n.isCollapsed && n.isCollapsed()));
                } catch (e) {}
            });

            // ---- Alt+1~5：从选中节点展开到第 N 级 ----
            // 走页面自己的门面 expandSelectedToLevel（更深层一律收起），
            // 它不是内核命令，不能用 execCommand 调。
            for (var _lv = 1; _lv <= 5; _lv++) {
                (function (lv) {
                    kmShortcut('alt+' + lv, function () {
                        try {
                            if (window.__minder && window.__minder.expandSelectedToLevel) {
                                window.__minder.expandSelectedToLevel(lv);
                            }
                        } catch (e) {}
                    });
                })(_lv);
            }
        })();


        /* ============================================================
           关键色派生：画布怎么变，骨架都看得见

           为什么需要：画布底色跟随外壳主题，节点配色却是**自带主题的固定
           调色板**，两者由不同的人选，必然出现错配。典型是 fresh-*：
           main 节点 #EEF3F6 配 white 连接线，在它自己的 #FBFBFB 底上靠
           投影区分；画布一变，连接线与节点边界就可能消失。

           实现与 plugins/mindmap/themes.js 的 criticalOverrides() 同源。
           之所以复制一份而不是 import：本页是传统 <script> 加载，走 ES
           module 在部分协议下会被 CORS 挡住。canvas-theme-test 里有
           「两处实现必须一致」的比对断言，防止它们各自漂移。
           ============================================================ */

function _kmParseColor(c) {
            var m = String(c || '').match(/rgba?\(([^)]+)\)/);
            var r, g, b;
            if (m) {
                var p = m[1].split(/[,\s\/]+/).filter(Boolean).map(Number);
                r = p[0]; g = p[1]; b = p[2];
            } else {
                var h = String(c || '').trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
                if (!h) return null;
                var t = h[1];
                if (t.length === 3) t = t.split('').map(function (x) { return x + x; }).join('');
                r = parseInt(t.slice(0, 2), 16);
                g = parseInt(t.slice(2, 4), 16);
                b = parseInt(t.slice(4, 6), 16);
            }
            if ([r, g, b].some(function (v) { return typeof v !== 'number' || isNaN(v); })) return null;
            return [r, g, b];
        }
        function _kmRelLum(c) {
            var rgb = _kmParseColor(c);
            if (!rgb) return 0;
            var f = function (n) { var v = n / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
            return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
        }
        function _kmContrast(a, b) {
            var la = _kmRelLum(a), lb = _kmRelLum(b);
            var hi = Math.max(la, lb), lo = Math.min(la, lb);
            return (hi + 0.05) / (lo + 0.05);
        }
        function _kmClamp255(n) { return Math.max(0, Math.min(255, n)); }
        function _kmToHex(rgb) {
            return '#' + rgb.map(function (n) {
                return _kmClamp255(n).toString(16).padStart(2, '0');
            }).join('');
        }
        function _kmShift(c, d) {
            var rgb = _kmParseColor(c);
            if (!rgb) return c;
            return _kmToHex(rgb.map(function (n) { return _kmClamp255(n + d); }));
        }
        function _kmIsLight(c) {
            var rgb = _kmParseColor(c);
            if (!rgb) return false;
            return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) > 140;
        }
        /* 只调亮度、不动色相饱和度 —— 派生出来的线/文字仍是同一色调家族 */
        function _kmAwayFrom(base, ratio) {
            var light = _kmIsLight(base);
            var dir = light ? -1 : 1;
            for (var i = 1; i <= 64; i++) {
                var c = _kmShift(base, dir * i * 4);
                if (_kmContrast(c, base) >= ratio) return c;
            }
            return light ? '#141418' : '#f2f2f4';
        }
        function _kmPaintable(v) {
            var s = String(v || '').trim().toLowerCase();
            if (!s || s === 'none' || s === 'transparent') return false;
            return /^(#|rgb|hsl)/.test(s);
        }
        function _kmCriticalOverrides(canvasBg, items) {
            var out = {};
            if (!canvasBg || !items) return out;
            var cc = items['connect-color'];
            if (!cc || cc === 'none' || !_kmPaintable(cc) || _kmContrast(cc, canvasBg) < 2.5) {
                out['connect-color'] = _kmAwayFrom(canvasBg, 3);
            }
            var subBg = String(items['sub-background'] || '').toLowerCase();
            if (!subBg || subBg === 'transparent' || subBg === 'none') {
                var sc = items['sub-color'];
                if (!sc || !_kmPaintable(sc) || _kmContrast(sc, canvasBg) < 3) {
                    out['sub-color'] = _kmAwayFrom(canvasBg, 4.5);
                }
            }
            var types = ['root', 'main', 'sub'];
            for (var i = 0; i < types.length; i++) {
                var type = types[i];
                var fill = items[type + '-background'];
                var stroke = items[type + '-stroke'];
                if (!fill || !_kmPaintable(fill)) continue;
                if (_kmContrast(fill, canvasBg) >= 1.8) continue;
                if (_kmPaintable(stroke) && _kmContrast(stroke, canvasBg) >= 2.5) continue;
                out[type + '-stroke'] = _kmAwayFrom(canvasBg, 3);
            }
            return out;
        }

        
/** 把覆盖写回内核当前主题项 —— getThemeItems() 返回的是活对象 */
        function _kmApplyCritical() {
            if (!km || !km.getThemeItems) return;
            var items;
            try { items = km.getThemeItems(); } catch (e) { return; }
            if (!items) return;
            var bg = (_canvasVars && _canvasVars.canvasBg) || _CANVAS_DEFAULTS.canvasBg;
            var ov = _kmCriticalOverrides(bg, items);
            var n = 0;
            for (var k in ov) {
                if (!Object.prototype.hasOwnProperty.call(ov, k)) continue;
                items[k] = ov[k]; n++;
            }
            if (n && km.refresh) { try { km.refresh(); } catch (e) { /* 重排失败不影响已写入的色值 */ } }
            return n;
        }

        hostPost({ type: 'request', id: 0, action: 'log', payload: 'kityminder 就绪' });
    })();
    }, false);
    </script>
    <script>
        // 加载遮罩自隐：km 初始化完成后（DOMContentLoaded）隐藏；WebView2 每次导航/重载会自动重现本遮罩
        (function () {
            var el = document.getElementById('km-loading');
            if (!el) return;
            function hide() { el.style.display = 'none'; }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hide);
            else hide();
            window.addEventListener('load', hide);
            setTimeout(hide, 3000);   // 兜底：即使 DOMContentLoaded 未触发，也避免遮罩残留
        })();
    </script>
