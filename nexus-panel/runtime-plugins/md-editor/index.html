<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Markdown 编辑服务</title>
  <style>
    html, body { margin: 0; height: 100%; font: 12px/1.6 system-ui, sans-serif; }
    body { padding: 10px; box-sizing: border-box; color: var(--text, #ddd);
           display: flex; flex-direction: column; }
    .bar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    button { background: var(--surface, #333); color: var(--text, #ddd);
             border: 1px solid var(--edge, #444); border-radius: 3px;
             height: 24px; padding: 0 8px; cursor: pointer; font-size: 11px; }
    button.primary { background: var(--accent, #3E63DD); color: #fff; border-color: transparent; }
    .panes { display: flex; gap: 8px; flex: 1; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .pane > .t { font-size: 11px; opacity: .6; margin-bottom: 3px; }
    textarea { flex: 1; resize: none; background: var(--surface-sunk, #222);
               color: var(--text, #ddd); border: 1px solid var(--edge, #444);
               border-radius: 3px; padding: 6px; font: 12px/1.6 ui-monospace, monospace; }
    .preview { flex: 1; overflow: auto; background: var(--surface-sunk, #222);
               border: 1px solid var(--edge, #444); border-radius: 3px; padding: 8px; }
    .preview h1,.preview h2,.preview h3 { margin: .6em 0 .3em; }
    .preview code { background: rgba(128,128,128,.2); padding: 1px 4px; border-radius: 3px; }
    .preview pre { background: rgba(128,128,128,.15); padding: 8px; border-radius: 4px; overflow: auto; }
    .preview blockquote { margin: .5em 0; padding-left: 8px;
                          border-left: 3px solid var(--accent, #3E63DD); opacity: .85; }
    /*
     * 服务返回的 HTML 带 .markdown-body 包裹（见 md-render），
     * 而降级路径的极简版输出是裸标签。所以两套选择器都要有样式：
     *   · .preview h1            —— 命中降级路径的裸标签
     *   · .preview .markdown-body h1 —— 命中服务路径
     * 上面已有的 h1/code/pre/blockquote 是**后代**选择器，
     * 对两条路径都生效；这里只补以前缺的：表格、列表、图片、
     * 分隔线、删除线、任务列表勾选框。
     */
    .preview ul, .preview ol { margin: .4em 0; padding-left: 1.4em; }
    .preview li { margin: .15em 0; }
    .preview table { margin: .5em 0; border-collapse: collapse; font-size: 11px; }
    .preview th, .preview td {
      padding: 3px 8px; border: 1px solid var(--edge, #444); text-align: left;
    }
    .preview th { background: rgba(128,128,128,.12); }
    .preview img { max-width: 100%; }
    .preview hr { border: 0; height: 1px; margin: .8em 0;
                  background: var(--edge, #444); }
    .preview del { opacity: .7; }
    .preview input[type="checkbox"] { margin-right: 4px; }
    /* 代码块里的语言标记（服务路径才有） */
    .preview pre code { display: block; }
    .foot { display: flex; gap: 6px; margin-top: 8px; }
    .hint { opacity: .6; font-size: 11px; }
  </style>
