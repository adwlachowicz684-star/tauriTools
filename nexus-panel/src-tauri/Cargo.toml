[package]
name = "nexus-panel"
version = "0.1.0"
description = "Nexus Panel · 深色新拟态 Tauri 2.x 插件面板"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-ico / image-png：供 set_window_icon 解码图标文件（换软件窗口图标用）。
# 这两个 feature 会额外拉入 image 相关 crate，首次构建需要联网下载；
# 若不需要换图标功能，可一并删掉这两个 feature、src/main.rs 里的 set_window_icon
# 命令及其在 invoke_handler 中的注册。
# tray-icon：托盘图标（main.rs 的 TrayIconBuilder / TrayIconEvent 需要）。
# 这个 feature 默认不开启，漏了它 main.rs 会报 E0432「unresolved import tauri::tray」，
# 且报错信息只说「gated behind the tray-icon feature」，不提示该去哪加。
tauri = { version = "2", features = ["protocol-asset", "devtools", "image-ico", "image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 脑图：SVG → PDF（矢量、静默） ----
# svg2pdf 由 Typst 团队维护，纯 Rust，**不碰任何 Windows API**，
# 因此与下面「刻意不引 windows-sys」的原则不冲突 —— 它不依赖系统环境，
# 只是增加打包体积（约 8–13 MB / 223K SLoC，主要是 usvg / resvg / fontdb）。
#
# 转换**不栅格化**（"no quality is lost"），脑图导出的是矢量 PDF。
#
# 体积可裁剪：svg2pdf 默认启用 image / filters / text 三个 feature，
# 而 kityminder 导出的 SVG 经核实**不含任何 SVG filter**（唯一一次 `filter`
# 出现在 JS 数组方法里），关掉 `filters` 可省下 resvg + tiny-skia。
# 但 default-features=false 尚未编译验证，为降低风险这里保留默认，
# 需要瘦身时再改：
#   svg2pdf = { version = "0.13.0", default-features = false, features = ["text", "image"] }
svg2pdf = "0.13.0"

# 说明：本项目刻意不引 windows-sys。
# 屏幕取色 / 截图改用 PowerShell + System.Drawing 实现 —— 句柄类型在
# windows-sys 各版本间是 isize 或 *mut c_void，一旦猜错就是硬编译错误，
# 而这两个功能都是低频操作，多花几百毫秒启动 PowerShell 完全可以接受。

# ---- agent_flow 插件所需 ----
# shell   启动 traecli / codebuddy 子进程并流式读取 stdout
# http    抓取订阅源 & 调用大模型 API，绕过 webview 同源策略。
#         用官方插件而不是自己接 reqwest：TLS 已处理好，
#         不必在 Windows 上额外折腾 openssl / cmake
# notify  目录监听（监听触发器）
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
# single-instance：保证同时只有一个应用实例。
# 第二个实例启动时会被插件直接结束，并由**已有实例**执行回调（把窗口拉到前台）。
# 官方建议按 target 限定（移动端不支持），本项目当前是纯桌面端
# （无 lib.rs / mobile_entry_point），故与上面两个插件一样放在普通
# dependencies 里；将来要支持移动端时再改成 target 段 + #[cfg(desktop)]。
tauri-plugin-single-instance = "2"
# updater：应用自更新。官方插件，验签（minisign）与平台差异都已处理好。
# 注意：它的 JS 命令（plugin:updater|*）**没有**写进 capabilities/default.json ——
# 本项目只走 src/updater.rs 的自有命令，不把"下载并安装"直接暴露给 webview。
tauri-plugin-updater = "2"
notify = "6"
pdfium-render = "0.9.4"
image = "0.25.6"
md5 = "0.8.1"
rayon = "1.10.0"

# zip：dupview 的「打包为 ZIP」右键菜单（src/dupview/pack.rs）要用。
# 内置纯 Rust 实现，不调 7z / WinRAR —— 这个插件要"下载下来就能用"，
# 不能假设别人机器上装了什么。代价只是体积。
#
# 这个 crate **本来就在依赖树里**（tauri-plugin-updater 在 Windows 上依赖它），
# 所以引它不增加下载量。但 updater 用的是 default-features = false，
# 压缩功能是关的 —— 必须由这里显式开 `deflate-flate2`，
# 否则 CompressionMethod::Deflated 写出来的条目不会真压缩（Stored 一样）。
# `deflate-flate2` 拉的是 flate2（已在树里）的默认后端 miniz_oxide（纯 Rust），
# 不引入 C 依赖。刻意不开 default：那会带进 aes/bzip2/lzma/zstd/xz 等一堆用不上的东西。
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

# regex：dupview 的改名规则引擎（src/dupview/rename.rs）要用。
# 那套规则是从 python 的 re 模块移植的，正则里带 Unicode 字符类与括号捕获；
# 换成手写扫描容易在边界上跑偏，而"与旧版逐字一致"正是这份引擎的全部价值。
# 它本来就在依赖树里（tauri 间接依赖），加进来不增加下载量。
regex = "1"

# ---- OS 凭据管理器（保险箱主密钥）----
# 主密钥存进 OS 凭据管理器，而不是应用数据目录 ——
# 这样"拷走整个目录"解不开凭据。
#
# 按平台分别指定 feature，而不是一次性开三个：
# Windows 上拉 dbus/openssl 纯属浪费，且 Linux 的 Secret Service
# 依赖在每个发行版上的可用性都不一样，没必要让其它平台承担。
#
# keyring 3.x 要求显式指定至少一个 credential store feature，
# 不指定会编译失败。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
