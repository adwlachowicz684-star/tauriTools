[package]
name = "nexus-panel"
version = "0.1.0"
description = "Nexus Panel · 深色新拟态 Tauri 2.x 插件面板"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-ico / image-png：供 set_window_icon 解码图标文件（换软件窗口图标用）。
# 这两个 feature 会额外拉入 image 相关 crate，首次构建需要联网下载；
# 若不需要换图标功能，可一并删掉这两个 feature、src/main.rs 里的 set_window_icon
# 命令及其在 invoke_handler 中的注册。
tauri = { version = "2", features = ["protocol-asset", "devtools", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 说明：本项目刻意不引 windows-sys。
# 屏幕取色 / 截图改用 PowerShell + System.Drawing 实现 —— 句柄类型在
# windows-sys 各版本间是 isize 或 *mut c_void，一旦猜错就是硬编译错误，
# 而这两个功能都是低频操作，多花几百毫秒启动 PowerShell 完全可以接受。

# ---- agent_flow 插件所需 ----
# shell   启动 traecli / codebuddy 子进程并流式读取 stdout
# http    抓取订阅源 & 调用大模型 API，绕过 webview 同源策略。
#         用官方插件而不是自己接 reqwest：TLS 已处理好，
#         不必在 Windows 上额外折腾 openssl / cmake
# notify  目录监听（监听触发器）
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
notify = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
