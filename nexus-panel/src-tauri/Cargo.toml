[package]
name = "nexus-panel"
version = "0.1.0"
description = "Nexus Panel · 深色新拟态 Tauri 2.x 插件面板"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 以下两项为 agent_flow 插件所需：启动 CLI 子进程 + 目录监听
tauri-plugin-shell = "2"
notify = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
